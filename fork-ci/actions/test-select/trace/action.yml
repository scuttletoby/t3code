name: test-select-trace
description: >-
  Checks test-select against what the tests really touch: runs every test under strace and fails when a test reads
  or runs a tracked file whose change would not pick it on a pull request, or when a test fails or skips under the
  trace (not checked). Run the tests as the test job does (same runner, env). For a schedule or default-branch
  pushes, never a pull request's gate. Needs strace on the runner. Usage: ../README.md (Trace check).
inputs:
  config:
    description: The same test-select config, a plain path in the repository.
    required: false
    default: .github/test-select.json
  run:
    description: How one test runs, from the repository root; {test} is replaced by its path (shell-quoted).
    required: false
    default: python3 -I -B {test}
  jobs:
    description: How many tests are traced at once.
    required: false
    default: "2"
  report:
    description: >-
      A file each result line is also written to as soon as it is known, so a run that times out or is cancelled
      keeps what finished (upload it with if: always()). Empty: trace-check.txt in the runner's temp folder.
    required: false
    default: ""
outputs:
  report:
    description: The report file (written even when the run is cut off).
    value: ${{ steps.trace.outputs.report }}
runs:
  using: composite
  steps:
    # Runs only this release's script; the tests it traces are the caller's, run by the caller's own command.
    # A cancel or timeout stops every traced test at once (their process groups) and keeps the report so far.
    - id: trace
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        RUN: ${{ inputs.run }}
        JOBS: ${{ inputs.jobs }}
        REPORT: ${{ inputs.report }}
      run: python3 -I "$GITHUB_ACTION_PATH/../trace_check.py" --config "$CONFIG" --run "$RUN" --jobs "$JOBS" --report "${REPORT:-$RUNNER_TEMP/trace-check.txt}"
