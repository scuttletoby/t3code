# An example caller of the head gate (README.md, "The gate"). Copy it to .github/workflows/ on the project's default
# branch and fill in the CAPITALS. It runs from the default branch's copy whatever a pull request changes, and gives
# the pull request to the gate as a number, nothing more. Reviews and inline review comments start no run (README.md,
# "Run again after a review"): an issue comment, a push or a dispatch does.
name: Head gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: A pull request number; empty = every open, ready pull request into the default branch (the backfill).
        type: string
        default: ""

permissions: {}

jobs:
  gate:
    # A comment on an issue that is no pull request starts nothing.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    uses: scuttletoby/t3code/.github/workflows/fork-head-gate.yml@<release sha of ci/vN> # ci/vN
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # Needed: without it the guard sees no repository or organisation secret of the key's name and cannot refuse one.
    # The gate's own key comes from the Environment either way. Nothing can check that a caller passes it.
    secrets: inherit
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) }}
      config: .github/pr-queue.json
      check-name: CHECK_NAME
      required-lenses: | # one lens name per line; none = the gate refuses
        LENS_NAME
