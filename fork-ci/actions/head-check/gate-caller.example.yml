# An example caller of the head gate (README.md, "The gate"). Copy it to .github/workflows/ on the project's default
# branch and fill in the CAPITALS. It runs from the default branch's copy whatever a pull request changes, and gives
# the pull request to the gate as a number, nothing more. Reviews and inline review comments start it through the
# review trigger (review-trigger.example.yml, copied next to this file; README.md, "Run again after a review"): on its
# finished run the gate looks the pull request up by that run's head.
# In a public repository GitHub blocks pull_request_target (from 2026-12-02) unless a repository Actions policy allows
# it for exactly this file (README.md, "The gate", setup step 4): keep the file name the policy names.
# Review rules (a `review` block in the config): release, pin, then config, as in ../pr-queue/README.md, "Turning it on:
# release, pin, then config". Pin the release first: an older one refuses the whole config.
name: Head gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Head gate review trigger] # review-trigger.example.yml's name
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: A pull request number; empty = every open, ready pull request into the default branch (the backfill).
        type: string
        default: ""

permissions: {}

jobs:
  gate:
    # A comment on an issue that is no pull request starts nothing, nor does a review trigger run that did not finish
    # (a newer one on the same pull request replaced it) or that no review started (a workflow of the same name run by
    # a push or a pull request's own event: skipped here, before a guard job starts).
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request_review","pull_request_review_comment"]'), github.event.workflow_run.event)))
    # Review trigger runs of one head (a burst of reviews or line comments): one judges, the newest waits, the ones in
    # between are dropped while they wait. Never cancelled half-way (that would post a failure). Every other event has
    # a group of its own here, so a review run never drops it in this group. (The gate job's own group, per head, is
    # shared by all events: a newer job there replaces a waiting one and reads the newest state of the same head.)
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && format('head-gate-review-{0}-{1}', github.workflow_ref, github.event.workflow_run.head_sha) || format('head-gate-run-{0}', github.run_id) }}
      cancel-in-progress: false
    uses: scuttletoby/t3code/.github/workflows/fork-head-gate.yml@<release sha of ci/vN> # ci/vN
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # Needed: without it the guard sees no repository or organisation secret of the key's name and cannot refuse one.
    # The gate's own key comes from the Environment either way. Nothing can check that a caller passes it.
    secrets: inherit
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) }}
      config: .github/pr-queue.json
      check-name: CHECK_NAME
      # In shadow (or with no review block) these names decide. In enforce the config's path rules name the lenses and
      # these are required as well; empty this only after the base's config is in enforce. Empty, it is no floor: a
      # change only zero-lens rules match (`**/*.md` in review.recommended.json, AGENTS.md too) merges with no lens
      # (the guide, step 5).
      required-lenses: | # one lens name per line; none = the gate refuses, unless the config's review block is in enforce
        LENS_NAME
