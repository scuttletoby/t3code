# Fork copy of upstream's .github/actions/setup-ci-deps (that file stays unchanged in the tree, so
# upstream syncs apply to it cleanly). The fork's workflows use this copy; upstream's own workflows
# keep theirs. It is upstream's action plus one thing: a cache of the installed node_modules folders,
# so a job whose lockfile and toolchain match a saved install restores ~0.75 GB of node_modules
# instead of the ~1.2 GB pnpm store, and `vp install` only checks it (about 2 s, no downloads)
# instead of linking every package (about 9 s). Steps marked "Fork:" are the fork's; the rest is
# upstream's text.
#
# Upstream rule (enforced by .github/scripts/fork-setup-copy-check.cjs in Fork tests): the line
# below is the git blob id of upstream's action.yml this copy follows. When an upstream sync changes
# that file, the check fails until its change is ported here and the line is updated (`--record`);
# docs/fork/updates.md (Nightly sync runbook) does this first.
# upstream-blob: b2236f6a15cf871ddb0da42efe660138e5201363
name: Setup CI dependencies
description: Install Vite+ and the workspace dependencies from cache.
inputs:
  task-cache-read-token:
    description: Read-only credential for the private maintainer task cache
    required: false
    default: ""
  install:
    description: Set to "false" to set up Vite+ only, with no pnpm store or install
    required: false
    default: "true"
  install-args:
    description: Arguments for `vp install`, such as filters. Empty installs the whole workspace.
    required: false
    default: ""
  save-pnpm-store:
    description: Set to "false" when a concurrent job with the same install args saves the pnpm store
    required: false
    default: "true"
  # Fork: off restores and saves no node_modules, which is exactly upstream's action.
  cache-node-modules:
    description: Fork. Set to "false" to install from the pnpm store only, as upstream's action does
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # ~/.vite-plus holds vp, the Node.js runtime, and pnpm. A cache entry never
    # updates, so the key names all three versions; otherwise a pnpm or Node.js
    # bump makes every job download them from npm again.
    - name: Resolve Vite+ version
      id: vp
      shell: bash
      run: |
        echo "version=$(sed -nE 's/^  vite-plus: ([0-9][^ ]*)$/\1/p' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"
        echo "node=$(jq -r '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(jq -r '.packageManager' package.json)" >> "$GITHUB_OUTPUT"

    # Restore only: "Save Vite+" below writes the toolchain before this job
    # installs or runs project code.
    # Pinned because release-desktop.yml signs builds with this action in the job.
    - name: Restore Vite+
      id: vp_cache
      if: steps.vp.outputs.version != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.vite-plus
        key: vite-plus-home-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.vp.outputs.version }}-node${{ steps.vp.outputs.node }}-${{ steps.vp.outputs.pnpm }}

    # setup-vp always runs the installer, which fetches vp from npm even when
    # this exact version is installed. A cache hit already has everything, so
    # skip setup-vp and do its remaining work here. This keeps npm outages from
    # failing jobs.
    - name: Use cached Vite+
      if: steps.vp_cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
        "$HOME/.vite-plus/bin/vp" env use "${{ steps.vp.outputs.node }}"

    # vp gives each Node.js download attempt 10 minutes by default, so one
    # stalled stream holds the job that long. It retries 3 times and resumes
    # partial bytes, so a shorter limit costs a slow download only a retry.
    - name: Setup Vite+
      if: steps.vp_cache.outputs.cache-hit != 'true'
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
      env:
        VP_DOWNLOAD_TIMEOUT: "120"
      with:
        node-version-file: package.json
        cache: false
        run-install: false

    # vp downloads pnpm on first use, which would otherwise be after the save.
    - name: Fetch pnpm
      if: steps.vp.outputs.version != '' && steps.vp_cache.outputs.cache-hit != 'true'
      shell: bash
      run: vp pm cache dir

    - name: Save Vite+
      if: steps.vp.outputs.version != '' && steps.vp_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.vite-plus
        key: ${{ steps.vp_cache.outputs.cache-primary-key }}

    # A shared key lets whichever install saves first, often a small filtered
    # one, become every job's store. Each set of install args gets its own.
    - name: Resolve pnpm store
      id: pnpm_store
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
        metadata_dir="${pnpm_config_cache_dir:-$RUNNER_TEMP/pnpm-metadata}"
        echo "pnpm_config_cache_dir=$metadata_dir" >> "$GITHUB_ENV"
        echo "verified=$metadata_dir/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"
        if [[ -z "$INSTALL_ARGS" ]]; then
          echo "namespace=full" >> "$GITHUB_OUTPUT"
        else
          echo "namespace=filtered-$(printf '%s' "$INSTALL_ARGS" | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        fi

    # Fork: node_modules is cached on an exact key only (no restore keys): the lockfile, the
    # workspace's package.json files, pnpm-workspace.yaml, .npmrc, .pnpmfile, the patch files, pnpm's
    # settings from the environment, this action and its key script, the Vite+, Node.js and pnpm
    # versions, the install args, the OS release and the workspace and store paths
    # (node-modules-key.cjs). So an entry from another lockfile, toolchain or copy of this action is
    # never restored. A lockfile line the script cannot read for sure, or a runner that is not
    # GitHub-hosted (fleet jobs each have their own paths), turns the cache off.
    - name: Resolve node_modules cache
      id: node_modules
      if: inputs.install == 'true' && inputs.cache-node-modules == 'true'
      shell: bash
      env:
        NAMESPACE: ${{ steps.pnpm_store.outputs.namespace }}
        VP_VERSION: ${{ steps.vp.outputs.version }}
        NODE_VERSION: ${{ steps.vp.outputs.node }}
        PNPM: ${{ steps.vp.outputs.pnpm }}
        STORE_PATH: ${{ steps.pnpm_store.outputs.path }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/node-modules-key.cjs"

    - name: Restore node_modules
      id: node_modules_cache
      if: steps.node_modules.outputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.node_modules.outputs.paths }}
        key: ${{ steps.node_modules.outputs.key }}

    # Fork: a restore that failed half-way (a broken download or extraction) reports no hit but can
    # leave part of the folders behind, which pnpm could take for a finished install. Only a hit is
    # kept; anything else starts from no node_modules, as upstream's action does.
    - name: Drop a partial node_modules
      if: steps.node_modules.outputs.key != '' && steps.node_modules_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NODE_MODULES_PATHS: ${{ steps.node_modules.outputs.paths }}
      run: |
        while IFS= read -r dir; do
          if [[ -n "$dir" ]]; then rm -rf -- "$dir"; fi
        done <<< "$NODE_MODULES_PATHS"

    # Filtered installs prefer the current full store, which holds every package,
    # over an older store of their own.
    # The pnpm store stays a cache tarball on the runner's own disk. A store on a
    # Blacksmith sticky disk mounts in under a second, but pnpm then copies every
    # package across filesystems instead of hard-linking it: install took 28-49s
    # against 9s plus an 11s restore.
    # Fork: not needed after a node_modules hit (`vp install` then links nothing).
    - name: Restore pnpm store
      id: pnpm_cache
      if: inputs.install == 'true' && steps.node_modules_cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.path }}
        key: pnpm-${{ steps.pnpm_store.outputs.namespace }}-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
        restore-keys: |
          pnpm-full-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          pnpm-${{ steps.pnpm_store.outputs.namespace }}-v1-${{ runner.os }}-${{ runner.arch }}-
          pnpm-full-v1-${{ runner.os }}-${{ runner.arch }}-

    # pnpm accepts an earlier pass for the same lockfile and policy at any age, so
    # a cached record skips fetching registry metadata for every package.
    - name: Restore lockfile verification
      id: pnpm_verified
      if: inputs.install == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.verified }}
        key: pnpm-verified-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      # Unquoted so each filter is its own argument.
      run: vp install $INSTALL_ARGS

    - name: Save lockfile verification
      if: inputs.install == 'true' && steps.pnpm_verified.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.verified }}
        key: ${{ steps.pnpm_verified.outputs.cache-primary-key }}

    # A filtered install that started from the current full store adds nothing
    # worth a second copy of it. A stacked PR, based on a branch other than the
    # default, saves a ~1 GB store only its own reruns can read, so it only restores.
    # Concurrent jobs with the same install args reserve one key, so the losers
    # compress the store for nothing; all but one pass save-pnpm-store: false.
    # Fork: never after a node_modules hit, when the store was not restored (it would save a nearly
    # empty store under the full store's key).
    - name: Save pnpm store
      if: >-
        inputs.install == 'true' && inputs.save-pnpm-store == 'true' &&
        steps.node_modules_cache.outputs.cache-hit != 'true' &&
        (github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch) &&
        steps.pnpm_cache.outputs.cache-hit != 'true' &&
        (steps.pnpm_store.outputs.namespace == 'full' ||
          steps.pnpm_cache.outputs.cache-matched-key != format('pnpm-full-v1-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json')))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.path }}
        key: ${{ steps.pnpm_cache.outputs.cache-primary-key }}

    # Fork: saved right after the install, before the job runs anything that writes into
    # node_modules (test caches, the Electron download), by the store's saver only (one job per set
    # of install args). Only a push to the default branch that tests the pushed commit saves (the key
    # script's `save`, checked again here): a pull request, a dispatch or call that tests another
    # ref, and a schedule only restore. An entry is only ever written whole: actions/cache commits it
    # after the upload finishes.
    - name: Save node_modules
      if: >-
        steps.node_modules.outputs.key != '' && steps.node_modules.outputs.save == 'true' &&
        inputs.save-pnpm-store == 'true' &&
        github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        steps.node_modules_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.node_modules.outputs.paths }}
        key: ${{ steps.node_modules.outputs.key }}

    - name: Enable shared task cache
      if: >-
        github.repository == 'pingdotgg/t3code' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        hashFiles('.task-cache.json') != '' &&
        inputs.task-cache-read-token != ''
      shell: bash
      env:
        T3_TASK_CACHE_READ_TOKEN: ${{ inputs.task-cache-read-token }}
      run: |
        node infra/task-cache/scripts/install-ci.ts
        if [[ ( "$GITHUB_EVENT_NAME" == pull_request && "$GITHUB_BASE_REF" == main ) || ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
          echo 'VP_REMOTE_CACHE=read-write' >> "$GITHUB_ENV"
        else
          echo 'VP_REMOTE_CACHE=read' >> "$GITHUB_ENV"
        fi
