name: Fork release

# Builds this fork's release `v<upstream>-fork.<n>`: upstream's tests, the Linux x64 server archive
# with SHA256SUMS, and the desktop apps (Linux x64, Windows x64, macOS arm64 and x64), all on
# GitHub-hosted runners and unsigned unless signing secrets exist. <upstream> is the newest stable
# upstream tag the commit contains; <n> counts the fork's earlier builds of it.
#
# Builds name this repository as their release repository (scripts/lib/release-repository.ts reads
# T3CODE_RELEASE_REPOSITORY, else GITHUB_REPOSITORY in Actions), so the server's update and the
# desktop app's updater look only at this fork. Publishing makes a normal (not pre-) release, a draft
# until every file is uploaded, marked latest only when it is the highest fork version.
#
# The guards live in .github/scripts/fork-release.sh (tests: fork-release.test.sh, run in preflight):
# only released upstream code, never a version that is already published, no silent API failures.
# Actions are pinned by commit. Only the publish job holds a write token, and it runs no package code.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build
        required: false
        default: main
        type: string
      publish:
        description: Publish the release (off builds and keeps the files on the run only)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish:
        required: false
        default: false
        type: boolean
    # Only the signing secrets release-desktop.yml declares; a caller passes these, never others.
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      MACOS_PROVISIONING_PROFILE:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME:
        required: false
    outputs:
      version:
        value: ${{ jobs.preflight.outputs.version }}
      tag:
        value: ${{ jobs.preflight.outputs.tag }}
      published:
        value: ${{ jobs.publish.outputs.published == 'true' }}

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  # The Windows desktop job reads this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
      upstream: ${{ steps.meta.outputs.upstream }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Test the release guards
        shell: bash
        run: bash .github/scripts/fork-release.test.sh

      # Refuses unreleased upstream commits, a stray upstream tag and a base above upstream's latest.
      - id: meta
        name: Resolve fork release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fork-release.sh resolve

  tests:
    name: Tests
    needs: [preflight]
    uses: ./.github/workflows/fork-tests.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}

  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Check bundle-only build support
        id: bundle_build
        shell: bash
        run: |
          set -euo pipefail
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Install browser secret helper build libraries
        if: steps.bundle_build.outputs.script == 'build:desktop'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        shell: bash
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
          T3CODE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: vp run ${{ steps.bundle_build.outputs.script }}

      # A build that still names upstream would update a fork install to upstream's releases. This
      # is the JS bundle; the assemble job checks the CLI archives, which bundle the server again.
      - name: Check the bundle names this repository
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -rqF "\"$GITHUB_REPOSITORY\"" apps/server/dist; then
            echo "::error::apps/server/dist does not name $GITHUB_REPOSITORY as its release repository."
            exit 1
          fi

      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-latest
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-latest
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      launch_check: false

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: ${{ vars.FORK_MACOS_RUNNER || 'macos-26' }}
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false
      launch_check: true

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS x64
      runner: ${{ vars.FORK_MACOS_RUNNER || 'macos-26' }}
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false
      launch_check: false

  # Collects and checks every release file with a read-only token; package code runs here only.
  assemble:
    name: Assemble release files
    needs:
      [preflight, tests, desktop_linux_x64, desktop_win_x64, desktop_mac_arm64, desktop_mac_x64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download desktop builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Write CLI archive checksums
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ! -f "t3-$VERSION-linux-x64.tar.gz" ]]; then
            echo "::error::The Linux x64 server archive is missing." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The `t3` executable in each archive bundles the server again (release-desktop.yml build-exe).
      - name: Check the CLI archives name this repository
        shell: bash
        run: bash .github/scripts/fork-release.sh check-archives release-assets

      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Name the Windows updater manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in release-assets/*-win-x64.yml; do
            mv "$x64_manifest" "${x64_manifest%-win-x64.yml}.yml"
          done

      # The desktop app on each platform reads one of these from the latest release.
      - name: Check updater manifests
        shell: bash
        run: |
          set -euo pipefail
          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            if [[ ! -f "release-assets/$manifest" ]]; then
              echo "::error::release-assets/$manifest is missing, so that platform's desktop app would find no update."
              exit 1
            fi
          done

      - name: Write release notes
        shell: bash
        env:
          UPSTREAM: ${{ needs.preflight.outputs.upstream }}
          BASE_TAG: ${{ needs.preflight.outputs.base_tag }}
          REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$BASE_TAG:refs/upstream/$BASE_TAG"
          {
            echo "Upstream [$BASE_TAG](https://github.com/$UPSTREAM/releases/tag/$BASE_TAG) with this fork's changes on top:"
            echo
            git log --reverse --format='- %s (%h)' "refs/upstream/$BASE_TAG..$REF"
          } > release-assets/release-notes.md
          cat release-assets/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  # The only job with a write token: it checks out just the guard script and runs no package code.
  publish:
    name: Publish release
    needs: [preflight, assemble]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout the guard script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-assets

      - name: Move the release notes aside
        shell: bash
        run: mv release-assets/release-notes.md release-notes.md

      # "Re-run failed jobs" reuses the preflight's version: refuse it once a tag or published
      # release has it. Drafts have no tag; one left by a stopped run of this version is removed.
      - name: Refuse a published version, remove leftover drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: bash .github/scripts/fork-release.sh remove-drafts "$TAG"

      - name: Create the release as a draft
        id: draft
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: T3 Code ${{ needs.preflight.outputs.tag }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS

      # Updaters skip drafts, so nobody sees a release until every file above is uploaded. The tag
      # check runs again right before; latest only when no published fork version is as high.
      - name: Publish the draft
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: bash .github/scripts/fork-release.sh publish "$RELEASE_ID" "$TAG" "$VERSION"
