name: Fork secret scan

# Every commit a pull request or a push adds, history included: a secret committed and then
# deleted is still public. The ranges, and why: .github/scripts/fork-secret-scan.sh.
#
# Three ways in, and the sweep:
# - pull_request: a run of its own for each push of a pull request's head, with no concurrency
#   group, so nothing cancels it. fork-tests.yml cancels a pull request's older run when a new push
#   comes, and a head a force push replaced would otherwise never be scanned to the end, although
#   GitHub still serves its commits by id. A finding there fails this run, on that old head.
# - push: every push to any branch or tag but the default branch, with no concurrency group: a
#   branch is public from its first push, with or without a pull request. About a minute of a
#   GitHub-hosted runner per push (a pushed pull request head also gets the two runs above and
#   below).
# - workflow_call from fork-tests.yml's `secrets` job (with `test`), for the check a ruleset
#   requires (fork-ci-result) and for pushes to the default branch (skipped by the push trigger
#   here). Release runs skip it there: their commit was scanned on its way to main. On a pull
#   request that check also reads every earlier head of the PR's branch (the scan step), since only
#   the newest head's check counts.
# - workflow_call from fork-secret-sweep.yml (daily, and by hand): the sweep, every ref but pull
#   request heads, for what no push run read. Same script and settings; no concurrency group. That
#   workflow opens an issue when the sweep fails (a schedule run alerts no one otherwise).
# The scan script always comes from the default branch's tip, never from the checkout: a pull
# request or a branch cannot change how it is scanned by editing the script, and an old branch
# gets today's scan. The checkout's own copy runs only in the `tests` job, on a runner of its own:
# nothing a pull request's code does there can reach the scan job's runner (its gitleaks, its PATH,
# its files). In the scan job no step runs the checkout's code (fork-contracts.test.py checks it).
# Keep it without a concurrency group (workflow or job): fork-contracts.test.py checks that.
on:
  pull_request:
  push:
  workflow_call:
    inputs:
      test:
        description: Also run the scan's tests against this gitleaks
        type: boolean
        default: false

permissions:
  contents: read

# Every job but `outside_pr` starts with the same condition as fork-tests.yml's (see there): on a
# pull request, only one whose branch is in this repository. Test: fork-contracts.test.py. The push
# trigger skips the default branch (fork-tests.yml scans it, with `test`) and branch deletions.
jobs:
  scan:
    name: Secret scan
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!(github.event_name == 'push' && !inputs.test && (github.event.deleted || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history without file contents. The scan script fetches the contents
      # of only the scanned commits (a failed fetch fails the job), then runs
      # gitleaks offline.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      # The checkout keeps the job's token in this repository's git config (persist-credentials
      # stays on: fork-contracts.test.py, rule `checkout`), so every git fetch in the job would send
      # it. Out of it before anything fetches (#317): checkout v6 includes a file under RUNNER_TEMP
      # holding the header (includeIf.<gitdir>.path), older versions hold the header itself; the
      # includes, the headers and that file all go (as in mobile-dev-client.yml). Then the step
      # fails unless no extraheader is left in any config git reads (includes followed). Nothing to
      # remove (a re-run, a checkout that kept no token) passes. This repository is public, so its
      # fetches need no token; a private copy's fetches then fail, and so does the job, never a pass.
      - name: Drop the checkout's token from the git config
        run: |
          set -euo pipefail
          { git config --local --name-only --get-regexp '^(includeif\..*\.path|http\..*\.extraheader)$' || true; } |
            sort -u | while IFS= read -r key; do git config --local --unset-all "$key"; done
          rm -f -- "${RUNNER_TEMP:?}"/git-credentials-*.config
          rc=0
          git config --get-regexp '\.extraheader$' > /dev/null || rc=$?
          if [[ "$rc" != 1 ]]; then
            echo "::error::Secret scan: the checkout's token is still in the git config (or the config cannot be read), so the scan's fetches would send it" >&2
            exit 2
          fi

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the added commits
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUSH_REF: ${{ github.event_name == 'push' && github.ref || '' }}
          # The scan script and a pull request's (or another branch's) gitleaks settings come from
          # this branch's tip, never from the checkout, and such a range is everything the head has
          # that this branch has not, whatever the PR's base (so a PR against a side branch, or one
          # retargeted later, is still fully read).
          # A schedule event's payload may have no repository; a schedule runs on the default branch.
          CONFIG_BRANCH: ${{ github.event.repository.default_branch || (github.event_name == 'schedule' && github.ref_name) || '' }}
          LOOKUP_TOKEN: ${{ github.token }}
        # The range leaves out the commits upstream (this fork's parent, as in fork-follow.yml)
        # already has. Parent not readable: UPSTREAM stays empty and the full range is scanned.
        # A pull request's scan also reads every earlier tip of its branch (OLD_HEADS): GitHub's
        # activity record of the branch lists each push and force push with the tips before and
        # after; a lookup that fails fails the job. The daily sweep reads every tip of every ref the
        # whole record lists the same way (a [skip ci] push whose branch is gone), with no time
        # window: a window would let an entry age out and the next sweep pass with the key still
        # there (#299). The sweep then fetches each listed tip it lacks, and asks GitHub's GraphQL
        # API (100 tips a query) which of those it could not fetch GitHub has no commit for at all:
        # git first, so a tip GitHub drops while the sweep runs is already gone when it asks. For
        # each such deleted tip it asks which runs had it as their head commit: one whose secret-scan
        # job succeeded (fork-secret-scan.yml's "Secret scan", or fork-tests.yml's, called or, in
        # older runs, its own) read it. Those (SCANNED_GONE) the script only warns on (#482); any
        # other deleted tip was never scanned and still fails the sweep unless the reviewed list of
        # tips known gone names it. A failed query (an API error, a rate limit), or an answer naming
        # another commit, fails the job; a tip the GraphQL answer leaves out counts as still shown.
        # The token reaches only these lookups (GH_TOKEN of each gh call): the step
        # after the checkout took it out of the git config, so no git command here sends it.
        run: |
          set -euo pipefail
          UPSTREAM=""
          OLD_HEADS=""
          UPSTREAM="$(GH_TOKEN="$LOOKUP_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // empty' || true)"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if ! OLD_HEADS="$(GH_TOKEN="$LOOKUP_TOKEN" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/activity" \
                -f "ref=refs/heads/$HEAD_REF" -f per_page=100 --jq '.[] | .before, .after')"; then
              echo "::error::Secret scan: cannot list the earlier heads of $HEAD_REF (GitHub's activity record), so a head a force push replaced could go unscanned. Re-run the job." >&2
              exit 2
            fi
          elif [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            if ! OLD_HEADS="$(GH_TOKEN="$LOOKUP_TOKEN" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/activity" \
                -f per_page=100 --jq '.[] | .before, .after')"; then
              echo "::error::Secret scan: cannot list GitHub's activity record, so a tip a deletion or force push left behind could go unscanned. Re-run the job." >&2
              exit 2
            fi
          fi
          SCANNED_GONE=""
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            mapfile -t tips < <(tr -s '[:space:]' '\n' <<< "$OLD_HEADS" | grep -E '^[0-9a-f]{40}$' | grep -vE '^0+$' | sort -u)
            unserved=()
            for tip in "${tips[@]}"; do
              git cat-file -e "$tip^{commit}" 2> /dev/null \
                || timeout 300 git fetch --quiet --no-tags --filter=blob:none origin "$tip" 2> /dev/null \
                || unserved+=("$tip")
            done
            deleted=()
            # shellcheck disable=SC2016 # $owner, $name and $id are GraphQL and jq variables, not the shell's
            for ((i = 0; i < ${#unserved[@]}; i += 100)); do
              query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) {'
              for tip in "${unserved[@]:i:100}"; do query+=" c_$tip: object(oid: \"$tip\") { oid }"; done
              if ! absent="$(GH_TOKEN="$LOOKUP_TOKEN" gh api graphql -f query="$query } }" \
                  -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
                  --jq '.data.repository | to_entries[] | (.key | ltrimstr("c_")) as $id |
                    if .value == null then $id elif .value.oid == $id then empty else error("not the asked commit") end')"; then
                echo "::error::Secret scan: cannot ask GitHub's API which listed tips it has no commit for, so a tip git no longer serves could not be told from one GitHub still shows. Re-run the job." >&2
                exit 2
              fi
              [[ -z "$absent" ]] || mapfile -t -O "${#deleted[@]}" deleted <<< "$absent"
            done
            for tip in "${deleted[@]}"; do
              if ! runs="$(GH_TOKEN="$LOOKUP_TOKEN" TIP="$tip" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
                  -f head_sha="$tip" -f per_page=100 --jq '.workflow_runs[] |
                    if .head_sha != env.TIP then error("not the asked commit") else . end |
                    select(.path == ".github/workflows/fork-secret-scan.yml" or .path == ".github/workflows/fork-tests.yml") | .id')"; then
                echo "::error::Secret scan: cannot list the runs of deleted tip $tip, so whether a scan read it is unknown. Re-run the job." >&2
                exit 2
              fi
              mapfile -t ids <<< "$runs"
              for id in "${ids[@]}"; do
                [[ "$id" =~ ^[0-9]+$ ]] || continue
                if ! scanned="$(GH_TOKEN="$LOOKUP_TOKEN" TIP="$tip" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                    -f filter=all -f per_page=100 --jq '.jobs[] | select(.head_sha == env.TIP and .conclusion == "success" and
                      (.name == "Secret scan" or .name == "Secret scan / Secret scan")) | .id')"; then
                  echo "::error::Secret scan: cannot list the jobs of run $id of deleted tip $tip, so whether a scan read it is unknown. Re-run the job." >&2
                  exit 2
                fi
                if [[ -n "$scanned" ]]; then
                  SCANNED_GONE+="$tip "
                  break
                fi
              done
            done
          fi
          unset LOOKUP_TOKEN
          export UPSTREAM OLD_HEADS SCANNED_GONE
          git fetch --quiet --no-tags --filter=blob:none origin "+refs/heads/$CONFIG_BRANCH:refs/scan-script/head"
          git show "refs/scan-script/head:.github/scripts/fork-secret-scan.sh" > "$RUNNER_TEMP/scan-from-default-branch.sh"
          bash "$RUNNER_TEMP/scan-from-default-branch.sh"

  # The scan's own tests, from the checkout (a pull request's copy), on a runner of their own: the
  # range rules against this gitleaks (a key added and deleted again before a merge of main, a key
  # only a merge commit adds, push ranges, earlier heads, settings the pull request cannot change,
  # octopus merges, commit objects, the sweep), and the repository's .gitleaks.toml (no path skipped,
  # rules and global allowlist as gitleaks' own, reviewed fake values by exact value), binary and
  # UTF-16 contents, settings that fail to load.
  tests:
    name: Secret scan tests
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.test) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Test the scan ranges
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash .github/scripts/fork-secret-scan.test.sh

  outside_pr:
    name: Outside pull request
    if: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse an outside pull request
        run: |
          echo "::error::outside PR: not tested here; a maintainer must review"
          exit 1
