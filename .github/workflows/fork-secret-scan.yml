name: Fork secret scan

# Every commit a pull request or a push adds, history included: a secret committed and then
# deleted is still public. The ranges, and why: .github/scripts/fork-secret-scan.sh.
#
# Two ways in, and the sweep:
# - push: every push to any branch or tag but the default branch, with no concurrency group, so
#   nothing cancels it: a branch is public from its first push, with or without a pull request.
#   About a minute of a GitHub-hosted runner per push. A pull request's head is such a branch, so
#   each push of it gets this run of its own: fork-tests.yml cancels a pull request's older run when
#   a new push comes, and a head a force push replaced would otherwise never be scanned to the end,
#   although GitHub still serves its commits by id. A finding there fails this run, on that old head.
#   (Until #1090 a pull_request trigger ran the same scan a second time for each such push. The
#   push run reads what that run read for the head, every commit it has that the default branch
#   has not, minus upstream's own commits; each earlier head had its push run when it was pushed;
#   and fork-tests.yml's call reads the head and every earlier head again, upstream's commits too.
#   Only a pull request from another fork has a head no push run sees, and the scan job never ran
#   for one.)
# - workflow_call from fork-tests.yml's `secrets` job (with `test`), for the check a ruleset
#   requires (fork-ci-result) and for pushes to the default branch (skipped by the push trigger
#   here). Release runs skip it there: their commit was scanned on its way to main. On a pull
#   request that check also reads every earlier head of the PR's branch (the scan step), since only
#   the newest head's check counts. In such a call github.event_name is pull_request, so the
#   pull_request range of the scan script (and the jobs' pull_request conditions) are this call's.
# - workflow_call from fork-secret-sweep.yml (daily, and by hand): the sweep, every ref but pull
#   request heads, for what no push run read. Same script and settings; no concurrency group here
#   (that workflow runs its sweeps on one ref one at a time, for the record). That workflow opens
#   an issue when the sweep fails (a schedule run alerts no one otherwise).
# The scan script always comes from the default branch's tip, never from the checkout: a pull
# request or a branch cannot change how it is scanned by editing the script, and an old branch
# gets today's scan. The checkout's own copy runs only in the `tests` job, on a runner of its own:
# nothing a pull request's code does there can reach the scan job's runner (its gitleaks, its PATH,
# its files). In the scan job no step runs the checkout's code (fork-contracts.test.py checks it).
# The one thing from another run is the sweep's record (#691), read as data only: lines checked
# one by one, from an artifact only the sweep's own jobs can keep (the scan job's first step).
# Keep it without a concurrency group (workflow or job): fork-contracts.test.py checks that.
on:
  push:
  workflow_call:
    inputs:
      test:
        description: Also run the scan's tests against this gitleaks
        type: boolean
        default: false
      reset_record:
        description: The sweep only (fork-secret-sweep.yml's input of that name) - read no earlier record of deleted tips, check every listed tip as on a first run, and keep a new record
        type: boolean
        default: false

permissions:
  contents: read

# Every job but `outside_pr` starts with the same condition as fork-tests.yml's (see there): on a
# pull request, only one whose branch is in this repository. Test: fork-contracts.test.py. The push
# trigger skips the default branch (fork-tests.yml scans it, with `test`) and branch deletions.
jobs:
  scan:
    name: Secret scan
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!(github.event_name == 'push' && !inputs.test && (github.event.deleted || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The sweep's record (#691): the deleted tips a scan read, so that such a tip is neither
      # fetched nor looked up again every day. The scan step reads it and writes this run's, which
      # the last step keeps as an artifact of this run. It comes from the newest run of
      # fork-secret-sweep.yml that ran to its end (success or failure), or a reset run in any state
      # (#992), schedule or workflow_dispatch, on this run's own branch, of this repository, whose
      # commit this run's commit has, and that kept one: only that workflow's own jobs, from that
      # branch's code, can add an artifact to such a run. (A cache, which any job of the branch can
      # write, would let any dependency a default-branch job installs reach this runner, #701.) The
      # archive is never unpacked: its one plain file is read, every line checked, and written under
      # RUNNER_TEMP, before the checkout. This step holds only the job's read-only token; the scan
      # step checks every line again and trusts the record only for tips GitHub's API still has no
      # commit for. No record (none kept yet, expired after 90 days, a run on a tag, the input
      # reset_record), or any doubt: a warning, and every listed tip is checked as on a first run.
      # To start the record afresh, run the sweep by hand with reset_record. Writing a record needs
      # write access to the branch (on main: a merge after green CI; admins may bypass), and it can
      # only spare tips GitHub's API calls gone. A run on a tag named like the branch has that name
      # as its head_branch too: while such a tag exists no record is read (#703); a ruleset that
      # blocks creating it closes the case of one created and deleted again. A re-run of a sweep run
      # looks for its own earlier attempt's record first (#703). After "Re-run failed jobs" (or a
      # re-run of this job alone) the run is expected to still list it, so the re-run goes on from
      # it: GitHub's docs say a re-run job's artifacts move to the new attempt, and it was seen live
      # only on a re-run of this job alone of a good run (#950: listed, read from the run itself,
      # then replaced by the re-run's upload); the first "Re-run failed jobs" of a failed sweep logs
      # whether it holds. "Re-run all jobs" deletes an earlier attempt's artifacts (#950), so such a
      # re-run warns and reads as a new run does: a reset run's re-run takes the empty record, any
      # other the newest earlier sweep's (never its own run's). A re-run logs both checks. A reset
      # run is never re-run, only followed by a new run (the one rule in fork-secret-sweep.yml's
      # header, #950). A reset run, known by its run name, is listed whatever its outcome,
      # unfinished too (a re-run of it that waits or runs), and its record is read; when it has none
      # (cancelled, failed before its upload, a re-run under way, expired) or is on a commit this
      # branch lacks, no older record is read either: the empty record instead (#950, #992). A
      # re-run of a run that started before a listed reset run (a higher run id) does not read its
      # own earlier attempt's record, which is from before that reset: it warns and reads as a new
      # run does (#992). The output `read` says how the read ended, for the scan step's partial
      # record.
      - name: Read the sweep's record
        id: read
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESET: ${{ inputs.reset_record }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP:?}/sweep-record"
          zip="${RUNNER_TEMP:?}/sweep-record.zip"
          rm -rf -- "$dir" "$zip"
          mkdir -m 700 -- "$dir"
          # none STATE WHY: no record. STATE, the output `read`: "none" when no earlier sweep kept one,
          # "failed" when one may exist but cannot be read or trusted; then a partial record of this
          # run must not replace it (#703). A reset run on a branch (and its re-run) takes the empty
          # record instead of "failed": it trusts nothing, so it is always safe, and a failed call
          # cannot leave the record from before the reset in use (#791).
          none() {
            rm -rf -- "$zip" "$dir/deleted-tips"
            if [[ "$1" == failed && "$RESET" == true && "$GITHUB_REF" == refs/heads/* ]]; then
              echo "::warning title=Secret scan::$2" >&2
              empty_record
            fi
            echo "read=$1" >> "${GITHUB_OUTPUT:?}"
            echo "::warning title=Secret scan::$2, so every listed tip is checked as on a first run" >&2
            exit 0
          }
          [[ "$GITHUB_REF" == refs/heads/* ]] || none failed "a run on a tag reads no record of the sweep"
          # A re-run (attempt 2 on) first looks for its own earlier attempt's record (#703), and only in a
          # run of the sweep's own workflow: in another workflow's run, any of its jobs could have kept an
          # artifact of that name. "Re-run failed jobs" is expected to leave that record in the run (not
          # yet seen live, #950); "Re-run all jobs" deletes it (#950), and the re-run then warns and reads
          # as a new run does. Both checks are logged.
          self=""
          if [[ "${GITHUB_RUN_ATTEMPT:-1}" != 1 \
              && "${GITHUB_WORKFLOW_REF:-}" == "$GITHUB_REPOSITORY/.github/workflows/fork-secret-sweep.yml@"* ]]; then
            self="$GITHUB_RUN_ID $GITHUB_SHA"
          fi
          [[ "${GITHUB_RUN_ATTEMPT:-1}" == 1 ]] || echo "::notice title=Secret scan::attempt $GITHUB_RUN_ATTEMPT of run $GITHUB_RUN_ID, workflow ref ${GITHUB_WORKFLOW_REF:-(unset)}: $([[ -n "$self" ]] && echo "the sweep's, so its own earlier record is looked for first" || echo "not the sweep's, so its own earlier record is not looked for")"
          # reset_record: an empty record (the header only), which the last step keeps even when this
          # run fails before the scan step writes its own, so no later sweep reads the older one (#703).
          # A re-run of a reset run (it keeps the input) first looks for its own earlier attempt's record,
          # which was written after the reset, and no older run's; without one (none kept, or deleted by
          # "Re-run all jobs", #950), or when it cannot be read, the empty record.
          empty_record() {
            echo "fork secret sweep record 2" > "$dir/deleted-tips"
            echo "read=reset" >> "${GITHUB_OUTPUT:?}"
            echo "::warning title=Secret scan::the sweep's record is reset (input reset_record), so every listed tip is checked as on a first run, and an empty record is kept even if this run fails" >&2
            exit 0
          }
          [[ "$RESET" != true || -n "$self" ]] || empty_record
          export BRANCH="${GITHUB_REF#refs/heads/}"
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || none failed "this branch's name has characters the tag check does not take"
          if ! tag="$(gh api -X GET "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$BRANCH" \
              --jq '.[] | select(.ref == "refs/tags/" + env.BRANCH) | .ref')"; then
            none failed "whether a tag is named like this branch cannot be checked"
          fi
          [[ -z "$tag" ]] || none failed "a tag is named like this branch, and a sweep run on it would pass for one on the branch"
          # The runs that ended in success or failure, and every reset run (known by its run name,
          # fork-secret-sweep.yml's run-name, #950) whatever its outcome, unfinished too: a re-run of one
          # that waits or runs (#992). So no status filter: the API then lists unfinished runs as well.
          runs=""
          if [[ "$RESET" != true ]] && ! runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/fork-secret-sweep.yml/runs" \
              -f branch="$BRANCH" -f per_page=30 --jq '.workflow_runs[] |
                select(.path == ".github/workflows/fork-secret-sweep.yml" and (.event == "schedule" or .event == "workflow_dispatch")
                  and .head_branch == env.BRANCH and .repository.full_name == env.GITHUB_REPOSITORY
                  and .head_repository.full_name == env.GITHUB_REPOSITORY
                  and (.display_title == "Fork secret sweep (reset_record)"
                    or (.status == "completed" and (.conclusion == "success" or .conclusion == "failure")))) |
                "\(.id) \(.head_sha) \(if .display_title == "Fork secret sweep (reset_record)" then "reset" else "sweep" end)"')"; then
            none failed "the sweep's earlier runs cannot be listed"
          fi
          # A re-run of a sweep run that started before a reset run (a higher run id: ids only go up) does
          # not read its own earlier attempt's record, which is from before that reset (#992): it reads as a
          # new run does, so the reset run's record or the empty one. It sees only the reset runs listed.
          if [[ -n "$self" ]]; then
            while read -r id sha kind; do
              [[ "$kind" == reset && "$id" =~ ^[1-9][0-9]{0,17}$ && "$id" -gt "$GITHUB_RUN_ID" ]] || continue
              echo "::warning title=Secret scan::this re-run's run started before sweep run $id, a reset run (input reset_record), so its own earlier attempt's record, from before that reset, is not read: it reads as a new run does" >&2
              self=""
              break
            done <<< "$runs"
          fi
          # unread WHY: a run whose record is not read. A reset run's (none kept: cancelled, failed before
          # its upload, a re-run of it still under way; expired; or on a commit this branch lacks): an older
          # record may be from before the reset, so none is read, and this run takes the empty record (kept
          # even if it fails), as that run did (#950, #992). So does a reset run waiting behind this one:
          # safe, only a second set of lookups. Any other run: the next one is tried.
          unread() {
            [[ "$kind" == reset ]] || return 0
            echo "::warning title=Secret scan::sweep run $id, a reset run (input reset_record), $1, so no record from before it is read" >&2
            empty_record
          }
          from=""
          while read -r id sha kind; do
            [[ "$id" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            [[ "$id" != "$GITHUB_RUN_ID" || "$id $sha" == "$self" ]] || continue
            # "LISTED KEPT [ID SIZE]": how many artifacts the API listed for the name, and how many of
            # them are this run's unexpired record (at most one, else no record is trusted).
            if ! found="$(RUN="$id" gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" -f name=fork-secret-sweep-record \
                --jq '"\(.artifacts | length) " +
                  ([.artifacts[] | select(.name == "fork-secret-sweep-record" and .expired == false and (.workflow_run.id | tostring) == env.RUN)] |
                  if length > 1 then error("more than one") else "\(length) \(.[0].id // "") \(.[0].size_in_bytes // "")" end)')"; then
              none failed "the record of sweep run $id cannot be listed"
            fi
            listed="" kept="" artifact="" size=""
            read -r listed kept artifact size <<< "$found"
            [[ "$listed" =~ ^[0-9]+$ && "$kept" =~ ^[01]$ ]] || none failed "the record of sweep run $id cannot be listed"
            if [[ "$id" == "$GITHUB_RUN_ID" ]]; then
              echo "::notice title=Secret scan::this run's own records: the API listed $listed artifact(s) of that name, $kept of them this run's unexpired record"
              [[ "$kept" == 1 ]] || echo "::warning title=Secret scan::this re-run finds no record of its earlier attempt: that attempt kept none, its record expired, or this is a \"Re-run all jobs\", which deletes an earlier attempt's artifacts (#950; \"Re-run failed jobs\" is expected to keep them, as GitHub's docs say, not yet seen live), so it reads as a new run does" >&2
            fi
            [[ "$kept" == 1 ]] || { unread "kept no record (or it expired)"; continue; }
            [[ "$artifact" =~ ^[0-9]+$ && "$size" =~ ^[0-9]+$ && "$size" -le 4000000 ]] || none failed "the record of sweep run $id is not the sweep's own"
            if ! has="$(gh api -X GET "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" -f per_page=1 --jq .status)"; then
              none failed "whether this branch has the commit of sweep run $id cannot be checked"
            fi
            [[ "$has" == ahead || "$has" == identical ]] || { unread "ran on a commit this branch does not have"; continue; }
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$zip" || none failed "the record of sweep run $id cannot be downloaded"
            [[ "$(stat -c %s -- "$zip")" -le 4000000 ]] || none failed "the record of sweep run $id is not the sweep's own"
            from="$id"
            break
          done <<< "$self"$'\n'"$runs"
          if [[ -z "$from" ]]; then
            [[ "$RESET" != true ]] || empty_record
            none none "no earlier sweep on $BRANCH kept a record (or it expired)"
          fi
          # The archive's one file, never unpacked: exactly one member, named deleted-tips, a plain
          # file (no link, no folder, not encrypted), at most 4 MB; its lines exactly the sweep's own
          # (header, then "<commit id> scanned", each once: no other byte, so no NUL or CR).
          python3 -I - "$zip" "$dir/deleted-tips" <<'EOF' || none failed "the record of sweep run $from cannot be read"
          import re, stat, sys, zipfile
          src, dst = sys.argv[1:3]
          try:
              with zipfile.ZipFile(src) as z:
                  [m] = z.infolist()
                  mode = m.external_attr >> 16
                  if (m.filename != "deleted-tips" or m.is_dir() or stat.S_IFMT(mode) not in (0, stat.S_IFREG)
                          or m.flag_bits & 1 or m.file_size > 4000000):
                      raise ValueError("not one plain file named deleted-tips")
                  with z.open(m) as f:
                      data = f.read(4000001)
          except Exception as e:
              sys.exit(f"the archive: {type(e).__name__}: {e}")
          if len(data) > 4000000 or not re.fullmatch(rb"fork secret sweep record 2\n(?:[0-9a-f]{40} scanned\n)*", data):
              sys.exit("not the sweep's own lines")
          tips = data.split(b"\n")[1:-1]
          if len(set(tips)) != len(tips):
              sys.exit("a tip listed twice")
          with open(dst, "xb") as f:
              f.write(data)
          EOF
          rm -f -- "$zip"
          echo "read=found" >> "${GITHUB_OUTPUT:?}"
          echo "::notice title=Secret scan::the sweep's record from run $from: $(($(wc -l < "$dir/deleted-tips") - 1)) deleted tip(s) a scan read"

      # Full history without file contents. The scan script fetches the contents
      # of only the scanned commits (a failed fetch fails the job), then runs
      # gitleaks offline.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      # The checkout keeps the job's token in this repository's git config (persist-credentials
      # stays on: fork-contracts.test.py, rule `checkout`), so every git fetch in the job would send
      # it. Out of it before anything fetches (#317): checkout v6 includes a file under RUNNER_TEMP
      # holding the header (includeIf.<gitdir>.path), older versions hold the header itself; the
      # includes, the headers and that file all go (as in mobile-dev-client.yml). Then the step
      # fails unless no extraheader is left in any config git reads (includes followed). Nothing to
      # remove (a re-run, a checkout that kept no token) passes. This repository is public, so its
      # fetches need no token; a private copy's fetches then fail, and so does the job, never a pass.
      - name: Drop the checkout's token from the git config
        run: |
          set -euo pipefail
          { git config --local --name-only --get-regexp '^(includeif\..*\.path|http\..*\.extraheader)$' || true; } |
            sort -u | while IFS= read -r key; do git config --local --unset-all "$key"; done
          rm -f -- "${RUNNER_TEMP:?}"/git-credentials-*.config
          rc=0
          git config --get-regexp '\.extraheader$' > /dev/null || rc=$?
          if [[ "$rc" != 1 ]]; then
            echo "::error::Secret scan: the checkout's token is still in the git config (or the config cannot be read), so the scan's fetches would send it" >&2
            exit 2
          fi

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the added commits
        id: scan
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUSH_REF: ${{ github.event_name == 'push' && github.ref || '' }}
          # The scan script and a pull request's (or another branch's) gitleaks settings come from
          # this branch's tip, never from the checkout, and such a range is everything the head has
          # that this branch has not, whatever the PR's base (so a PR against a side branch, or one
          # retargeted later, is still fully read).
          # A schedule event's payload may have no repository; a schedule runs on the default branch.
          CONFIG_BRANCH: ${{ github.event.repository.default_branch || (github.event_name == 'schedule' && github.ref_name) || '' }}
          LOOKUP_TOKEN: ${{ github.token }}
          RECORD_READ: ${{ steps.read.outputs.read }}
          RESET: ${{ inputs.reset_record }}
        # The range leaves out the commits upstream (this fork's parent, as in fork-follow.yml)
        # already has. Parent not readable: UPSTREAM stays empty and the full range is scanned.
        # A pull request's scan also reads every earlier tip of its branch (OLD_HEADS): GitHub's
        # activity record of the branch lists each push and force push with the tips before and
        # after; a lookup that fails fails the job. The daily sweep reads every tip of every ref the
        # whole record lists the same way (a [skip ci] push whose branch is gone), with no time
        # window: a window would let an entry age out and the next sweep pass with the key still
        # there (#299). Of the listed tips this clone lacks, the sweep first asks GitHub's GraphQL
        # API (100 tips a query, every run) which it has no commit for at all, then fetches the
        # others all at once (one by one only when that fails; one that still fails is asked about
        # again, as GitHub may have deleted it meanwhile). A tip GitHub has no commit for is fetched
        # once, the first time, in case git still serves it; then it is deleted (DELETED_TIPS, so
        # the scan script does not fetch it again). For each deleted tip it asks which runs had it
        # as their head commit: one whose secret-scan job succeeded (fork-secret-scan.yml's "Secret
        # scan", or fork-tests.yml's, called or, in older runs, its own) read it. Those
        # (SCANNED_GONE) the script only warns on (#482); any other deleted tip was never scanned and
        # still fails the sweep unless the reviewed list of tips known gone names it. A tip the last
        # sweep's record (#691, the first and last steps of this job) has as read by a scan is
        # neither fetched nor looked up again (a commit id's content cannot change); any other
        # deleted tip is fetched once every run, so one git serves again is scanned, and a tip on
        # the reviewed list is not looked up. So the lookups per run no longer grow with the
        # deleted tips. When a lookup fails half-way, or the lookups pass 20 minutes, the record
        # keeps the tips proven so far, so the next sweep (or, but for a reset run, a "Re-run failed
        # jobs" of this run, #950) goes on from there, unless the read step could not read the last
        # record (it may be bigger; it stays the one in use, #703). The error says which (RESET).
        # A failed query (an API error, a rate limit), or an answer naming another commit, fails the
        # job; a tip the GraphQL answer leaves out counts as still shown.
        # The token reaches only these lookups (GH_TOKEN of each gh call): the step
        # after the checkout took it out of the git config, so no git command here sends it.
        run: |
          set -euo pipefail
          # git_retry: a copy of .github/scripts/fork-git-retry.sh (this job runs none of the checkout's code); fork-git-retry.test.py holds it to that file.
          git_retry() {
            local net real waits err code=0 limit try=1 end=$((SECONDS + ${GIT_RETRY_TOTAL:-150}))
            net='Failed to connect|Could(n.t| not) resolve|Connection (refused|reset|timed out)|Operation timed out|Network is unreachable'
            net+='|Temporary failure in name resolution|Recv failure|Send failure|SSL_ERROR_SYSCALL|SSL_(connect|read)|gnutls_handshake'
            net+='|TLS connect error|returned error: (429|5[0-9][0-9])|RPC failed|early EOF|unexpected disconnect|hung up unexpectedly'
            net+='|was not closed cleanly|transfer closed with|Empty reply from server'
            real='not our ref|find remote ref|no such remote ref|unadvertised object|Authentication failed|could not read (Username|Password)'
            real+='|Repository not found|returned error: 4([01][0-9]|2[0-8]|[3-9][0-9])|not appear to be a git repository|invalid refspec'
            read -r -a waits <<< "${GIT_RETRY_WAITS:-5 10 20}"
            while :; do
              limit=$((end - SECONDS))
              ((limit < ${GIT_RETRY_TRY:-90})) || limit=${GIT_RETRY_TRY:-90}
              ((limit > 0)) || limit=1
              code=0
              if [[ -n "${GIT_RETRY_STDIN:-}" ]]; then
                { err="$(LC_ALL=C timeout -k 5 "$limit" git "$@" 2>&1 >&3 3>&- < "$GIT_RETRY_STDIN")" || code=$?; } 3>&1
              else
                { err="$(LC_ALL=C timeout -k 5 "$limit" git "$@" 2>&1 >&3 3>&-)" || code=$?; } 3>&1
              fi
              [[ -z "$err" ]] || printf '%s\n' "$err" >&2
              ((code)) || return 0
              if ((code != 124 && code != 137)) && { ! grep -qE "$net" <<< "$err" || grep -qE "$real" <<< "$err"; }; then
                return "$code"
              fi
              if ((try > ${#waits[@]})) || ((SECONDS + ${waits[try - 1]} + 5 > end)); then
                echo "::error::git $1: a connection error on try $try, the last one (git_retry: no tries or time left)" >&2
                return "$code"
              fi
              echo "::warning::git $1: a connection error on try $try (exit $code); trying again in ${waits[try - 1]} s" >&2
              sleep "${waits[try - 1]}"
              try=$((try + 1))
            done
          }
          UPSTREAM=""
          OLD_HEADS=""
          UPSTREAM="$(GH_TOKEN="$LOOKUP_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // empty' || true)"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if ! OLD_HEADS="$(GH_TOKEN="$LOOKUP_TOKEN" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/activity" \
                -f "ref=refs/heads/$HEAD_REF" -f per_page=100 --jq '.[] | .before, .after')"; then
              echo "::error::Secret scan: cannot list the earlier heads of $HEAD_REF (GitHub's activity record), so a head a force push replaced could go unscanned. Re-run the job." >&2
              exit 2
            fi
          elif [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            if ! OLD_HEADS="$(GH_TOKEN="$LOOKUP_TOKEN" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/activity" \
                -f per_page=100 --jq '.[] | .before, .after')"; then
              echo "::error::Secret scan: cannot list GitHub's activity record, so a tip a deletion or force push left behind could go unscanned. Re-run the job." >&2
              exit 2
            fi
          fi
          SCANNED_GONE=""
          DELETED_TIPS=""
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            mapfile -t tips < <(tr -s '[:space:]' '\n' <<< "$OLD_HEADS" | grep -E '^[0-9a-f]{40}$' | grep -vE '^0+$' | sort -u)
            # Which of them this blob-less clone lacks: one git process for all, lazy fetching off
            # (#637). A lazy fetch asks for the whole history again (no negotiation) and every lookup
            # of a missing commit reads every pack, so one by one that outran the job's 30 minutes.
            if ! lacked="$(printf '%s^{commit}\n' "${tips[@]}" | GIT_NO_LAZY_FETCH=1 git cat-file --batch-check='%(objectname)' 2> /dev/null)"; then
              echo "::error::Secret scan: cannot check which listed tips this clone lacks. Re-run the job." >&2
              exit 2
            fi
            mapfile -t missing < <(sed -n 's/^\([0-9a-f]\{40\}\)^{commit} missing$/\1/p' <<< "$lacked")
            # The last sweep's record (#691, read by the job's first step): each deleted tip a scan
            # read. Exactly its own lines or nothing: anything else (an older version's, a poisoned
            # one) is a warning and removed, and every tip is checked as on a first run. The bytes
            # are counted, not captured: a captured NUL would be dropped, and mapfile drops it too.
            record="${RUNNER_TEMP:?}/sweep-record/deleted-tips"
            declare -A recorded=()
            if [[ -e "$record" || -L "$record" ]]; then
              lines=()
              valid=""
              if [[ -f "$record" && ! -L "$record" ]] && [[ "$(stat -c %s -- "$record")" -le 4000000 ]] \
                  && [[ "$(LC_ALL=C tr -d 'a-z0-9 \n' < "$record" | wc -c)" -eq 0 ]] && mapfile -t lines < "$record" \
                  && [[ "${lines[0]:-}" == "fork secret sweep record 2" ]]; then
                valid=1
              fi
              for line in "${lines[@]:1}"; do
                if [[ -n "$valid" && "$line" =~ ^([0-9a-f]{40})\ scanned$ ]] \
                    && [[ -z "${recorded[${BASH_REMATCH[1]}]:-}" ]]; then
                  recorded[${BASH_REMATCH[1]}]=1
                else
                  valid=""
                fi
              done
              if [[ -z "$valid" ]]; then
                recorded=()
                rm -rf -- "$record"
                echo "::warning title=Secret scan::the last sweep's record of deleted tips cannot be read, so every listed tip is checked as on a first run" >&2
              fi
            fi
            # Whether a partial record (below) may replace the last one (#703): only when this run
            # read it here (or reset it to empty), or no earlier sweep kept one. Never when it could
            # not be read: it may be good and bigger, and one failed call must not shrink it.
            partial=""
            case "${RECORD_READ:-}" in
              none) partial=1 ;;
              found | reset) [[ ! -f "$record" ]] || partial=1 ;;
            esac
            # The reviewed list of tips known gone, as the scan script reads it (the default branch's
            # tip): a tip on it needs no lookup of its runs. Read loosely here, as the script checks
            # the list itself: a misread tip is only looked up, or counted unscanned.
            declare -A reviewed=()
            if [[ ${#missing[@]} -gt 0 ]]; then
              git_retry fetch --quiet --no-tags --filter=blob:none origin "+refs/heads/$CONFIG_BRANCH:refs/scan-script/head"
              while read -r tip; do reviewed[$tip]=1; done < <(git show "refs/scan-script/head:.github/fork-secret-sweep-gone-tips.txt" 2> /dev/null \
                | sed -nE 's/^([0-9a-f]{40})[[:space:]].*/\1/p')
            fi
            # ask TIP...: GitHub's GraphQL API, 100 tips a query; sets absent to those it has no commit
            # for at all. A failed query, or an answer naming another commit, fails the job.
            declare -A absent=()
            # shellcheck disable=SC2016 # $owner, $name and $id are GraphQL and jq variables, not the shell's
            ask() {
              local i tip query answer
              absent=()
              for ((i = 1; i <= $#; i += 100)); do
                query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) {'
                for tip in "${@:i:100}"; do query+=" c_$tip: object(oid: \"$tip\") { oid }"; done
                if ! answer="$(GH_TOKEN="$LOOKUP_TOKEN" gh api graphql -f query="$query } }" \
                    -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
                    --jq '.data.repository | to_entries[] | (.key | ltrimstr("c_")) as $id |
                      if .value == null then $id elif .value.oid == $id then empty else error("not the asked commit") end')"; then
                  echo "::error::Secret scan: cannot ask GitHub's API which listed tips it has no commit for, so a tip git no longer serves could not be told from one GitHub still shows. Re-run the job." >&2
                  exit 2
                fi
                while read -r tip; do
                  [[ ! "$tip" =~ ^[0-9a-f]{40}$ ]] || absent[$tip]=1
                done <<< "$answer"
              done
            }
            # GitHub is asked about every tip this clone lacks first (#691): those it still has are
            # fetched all at once (one by one only when that fails), and none it deleted can fail
            # that batch. A tip it has no commit for: git asked once every run (a tip git serves
            # again is fetched, so scanned), unless the record has it as read by a scan.
            ask "${missing[@]}"
            shown=()
            new=()
            deleted=()
            for tip in "${missing[@]}"; do
              if [[ -z "${absent[$tip]:-}" ]]; then
                shown+=("$tip")
              elif [[ -n "${recorded[$tip]:-}" ]]; then
                deleted+=("$tip")
              else
                new+=("$tip")
              fi
            done
            unserved=()
            if [[ ${#shown[@]} -gt 0 ]] \
                && ! timeout 600 git fetch --quiet --no-tags --filter=blob:none origin "${shown[@]}" 2> /dev/null; then
              for tip in "${shown[@]}"; do
                timeout 300 git fetch --quiet --no-tags --filter=blob:none origin "$tip" 2> /dev/null \
                  || unserved+=("$tip")
              done
            fi
            for tip in "${new[@]}"; do
              if ! err="$(timeout 300 git fetch --quiet --no-tags --filter=blob:none origin "$tip" 2>&1)"; then
                if ! grep -qiE 'not our ref|no such object' <<< "$err"; then
                  echo "::error::Secret scan: cannot fetch listed tip $tip, which GitHub's API has no commit for, and origin did not say it no longer has it (a network or server failure?). Re-run the job." >&2
                  exit 2
                fi
                deleted+=("$tip")
              fi
            done
            # A tip GitHub showed that git could not fetch: asked again (GitHub may have deleted it
            # meanwhile); one it still shows stays listed, and the scan script fails on it.
            if [[ ${#unserved[@]} -gt 0 ]]; then
              ask "${unserved[@]}"
              for tip in "${unserved[@]}"; do
                [[ -z "${absent[$tip]:-}" ]] || deleted+=("$tip")
              done
            fi
            # keep: this run's record, for the next one (the job's last step keeps it): the deleted
            # tips a scan read, as far as proven now (the last record's still deleted ones are marked
            # before any lookup, so they are in even when a lookup fails), nothing older (a tip GitHub
            # shows again, or the activity record no longer lists, is dropped). Written whole, then renamed, and only
            # then marked written: a run stopped before that keeps nothing. Also when a lookup fails
            # half-way, or the time limit is reached, before the job fails, if `partial` allows it:
            # the next sweep run, or a "Re-run failed jobs" of this one, goes on from there (#701, #703,
            # #950); "Re-run all jobs" deletes this attempt's record, so that re-run does not.
            # again: what such a stop tells to do. A reset run is never to be re-run, only followed by
            # a new run (fork-secret-sweep.yml's header says why), so its errors name no re-run (#950).
            again='Start a new run of the sweep (or wait for the next daily one), or use "Re-run failed jobs": both go on from what this one kept. Not "Re-run all jobs": it deletes the record this attempt kept (#950).'
            [[ "${RESET:-}" != true ]] || again='This is a reset run (input reset_record): start a new run of the sweep (or wait for the next daily one), never a re-run of this one. The new run goes on from what this one kept (fork-secret-sweep.yml says why).'
            declare -A read_by_scan=()
            keep() {
              local tip
              mkdir -p -- "${RUNNER_TEMP:?}/sweep-record"
              rm -rf -- "$record.new"
              {
                echo "fork secret sweep record 2"
                for tip in "${deleted[@]}"; do
                  [[ -z "${read_by_scan[$tip]:-}" ]] || echo "$tip scanned"
                done
              } > "$record.new"
              mv -f -- "$record.new" "$record"
              echo "record=written" >> "${GITHUB_OUTPUT:?}"
            }
            # Which deleted tips a scan read: on the record as read, no lookup (a scan read it for
            # good); on the reviewed list, none either (no evidence needed); any other, the runs that
            # had it as their head commit, one whose secret-scan job succeeded (fork-secret-scan.yml's
            # "Secret scan", or fork-tests.yml's, called or, in older runs, its own).
            for tip in "${deleted[@]}"; do
              DELETED_TIPS+="$tip "
              if [[ -n "${recorded[$tip]:-}" ]]; then
                read_by_scan[$tip]=1
                SCANNED_GONE+="$tip "
              fi
            done
            for tip in "${deleted[@]}"; do
              [[ -z "${read_by_scan[$tip]:-}" && -z "${reviewed[$tip]:-}" ]] || continue
              # A time limit well inside the job's 30 minutes (#703): 20 minutes of this step (the
              # steps before it take a few). Past it, the lookups stop as when one fails, and the
              # record keeps what they proved, so the next sweep run goes on from there (the error
              # says how: `again` above).
              if ((SECONDS > 1200)); then
                echo "::error::Secret scan: this step passed 20 minutes before the lookups of deleted tips ended, so they stop here, before the job's time limit. $again" >&2
                [[ -z "$partial" ]] || keep
                exit 2
              fi
              if ! runs="$(GH_TOKEN="$LOOKUP_TOKEN" TIP="$tip" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
                  -f head_sha="$tip" -f per_page=100 --jq '.workflow_runs[] |
                    if .head_sha != env.TIP then error("not the asked commit") else . end |
                    select(.path == ".github/workflows/fork-secret-scan.yml" or .path == ".github/workflows/fork-tests.yml") | .id')"; then
                echo "::error::Secret scan: cannot list the runs of deleted tip $tip, so whether a scan read it is unknown. $again" >&2
                [[ -z "$partial" ]] || keep
                exit 2
              fi
              mapfile -t ids <<< "$runs"
              for id in "${ids[@]}"; do
                [[ "$id" =~ ^[0-9]+$ ]] || continue
                if ! scanned="$(GH_TOKEN="$LOOKUP_TOKEN" TIP="$tip" gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                    -f filter=all -f per_page=100 --jq '.jobs[] | select(.head_sha == env.TIP and .conclusion == "success" and
                      (.name == "Secret scan" or .name == "Secret scan / Secret scan")) | .id')"; then
                  echo "::error::Secret scan: cannot list the jobs of run $id of deleted tip $tip, so whether a scan read it is unknown. $again" >&2
                  [[ -z "$partial" ]] || keep
                  exit 2
                fi
                if [[ -n "$scanned" ]]; then
                  read_by_scan[$tip]=1
                  SCANNED_GONE+="$tip "
                  break
                fi
              done
            done
            keep
          fi
          unset LOOKUP_TOKEN
          # The lists go to the scan in files (#637): the kernel caps one environment string at
          # 128 KiB, and the activity record outgrew it, so every program started after exporting
          # it failed ("Argument list too long"). Each id once; the variables are still exported
          # while they fit, for a default branch whose scan script predates the files.
          OLD_HEADS="$(tr -s '[:space:]' '\n' <<< "$OLD_HEADS" | sort -u)"
          printf '%s\n' "$OLD_HEADS" > "${RUNNER_TEMP:?}/old-heads"
          printf '%s\n' "$SCANNED_GONE" > "${RUNNER_TEMP:?}/scanned-gone"
          printf '%s\n' "$DELETED_TIPS" > "${RUNNER_TEMP:?}/deleted-tips"
          export UPSTREAM OLD_HEADS_FILE="${RUNNER_TEMP:?}/old-heads" SCANNED_GONE_FILE="${RUNNER_TEMP:?}/scanned-gone" \
            DELETED_TIPS_FILE="${RUNNER_TEMP:?}/deleted-tips"
          if [[ ${#OLD_HEADS} -le 100000 ]]; then export OLD_HEADS; fi
          if [[ ${#SCANNED_GONE} -le 100000 ]]; then export SCANNED_GONE; fi
          git_retry fetch --quiet --no-tags --filter=blob:none origin "+refs/heads/$CONFIG_BRANCH:refs/scan-script/head"
          git show "refs/scan-script/head:.github/scripts/fork-secret-scan.sh" > "${RUNNER_TEMP:?}/scan-from-default-branch.sh"
          # A default branch's script from before the files reads only the variables: a list too
          # long to export would reach it as an empty list, so a tip it names would go unscanned.
          if [[ ${#OLD_HEADS} -gt 100000 || ${#SCANNED_GONE} -gt 100000 ]] \
              && ! grep -q OLD_HEADS_FILE "${RUNNER_TEMP:?}/scan-from-default-branch.sh"; then
            echo "::error::Secret scan: the default branch's scan script reads the lists only from the environment, and they are too long for it, so it would scan none of the tips they name. Re-run the job once the default branch has the current script." >&2
            exit 2
          fi
          bash "${RUNNER_TEMP:?}/scan-from-default-branch.sh"

      # Kept whatever the scan found (the record says which deleted tips a scan read, not whether
      # they hold a key), also when the scan step failed or the run was cancelled, once that step
      # wrote it whole, or, for reset_record, the read step's empty one if the scan step wrote none.
      # Never from a run on a tag. An artifact of this run: 90 days (the repository's most), so a
      # daily sweep always finds the last one, and the next sweep reads it from this run only (the
      # first step). A re-run keeps its own, and overwrite replaces the earlier attempt's (still in
      # the run after a re-run of this job alone, seen live, and expected so after "Re-run failed
      # jobs", which moves it to the new attempt; deleted by "Re-run all jobs", #950), since a run
      # takes one artifact of a name.
      - name: Keep the sweep's record
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/') && (steps.scan.outputs.record == 'written' || steps.read.outputs.read == 'reset') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-secret-sweep-record
          path: ${{ runner.temp }}/sweep-record/deleted-tips
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # The scan's own tests, from the checkout (a pull request's copy), on a runner of their own: the
  # range rules against this gitleaks (a key added and deleted again before a merge of main, a key
  # only a merge commit adds, push ranges, earlier heads, settings the pull request cannot change,
  # octopus merges, commit objects, the sweep), and the repository's .gitleaks.toml (no path skipped,
  # rules and global allowlist as gitleaks' own, reviewed fake values by exact value), binary and
  # UTF-16 contents, settings that fail to load.
  tests:
    name: Secret scan tests
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.test) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Test the scan ranges
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash .github/scripts/fork-secret-scan.test.sh

  outside_pr:
    name: Outside pull request
    if: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse an outside pull request
        run: |
          echo "::error::outside PR: not tested here; a maintainer must review"
          exit 1
