name: Fork secret scan

# Every commit a pull request or a push to main adds, history included: a secret committed and then
# deleted is still public. The ranges, and why: .github/scripts/fork-secret-scan.sh.
#
# Two ways in:
# - pull_request: a run of its own for each push of a pull request's head, with no concurrency
#   group, so nothing cancels it. fork-tests.yml cancels a pull request's older run when a new push
#   comes, and a head a force push replaced would otherwise never be scanned to the end, although
#   GitHub still serves its commits by id. A finding there fails this run, on that old head.
# - workflow_call from fork-tests.yml's `secrets` job (with `test`), for the check a ruleset
#   requires (fork-ci-result) and for pushes to main. Release runs skip it there: their commit was
#   scanned on its way to main.
# Keep it without a concurrency group (workflow or job): fork-contracts.test.py checks that.
on:
  pull_request:
  workflow_call:
    inputs:
      test:
        description: Also run the scan's tests against this gitleaks
        type: boolean
        default: false

permissions:
  contents: read

# Every job but `outside_pr` starts with the same condition as fork-tests.yml's (see there): on a
# pull request, only one whose branch is in this repository. Test: fork-contracts.test.py.
jobs:
  scan:
    name: Secret scan
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history without file contents. The scan script fetches the contents
      # of only the scanned commits (a failed fetch fails the job), then runs
      # gitleaks offline.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # The range rules against this gitleaks: a key added and deleted again
      # before a merge of main, a key only a merge commit adds, push ranges,
      # settings the pull request cannot change, octopus merges; and the
      # repository's .gitleaks.toml (no path skipped, rules and global allowlist
      # as gitleaks' own, reviewed fake values by exact value), binary and
      # UTF-16 contents, settings that fail to load.
      - name: Test the scan ranges
        if: ${{ inputs.test }}
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash .github/scripts/fork-secret-scan.test.sh

      - name: Scan the added commits
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # A pull request's gitleaks settings come from this branch's tip, never from the PR, and
          # the PR range is everything its head has that this branch has not, whatever the PR's
          # base (so a PR against a side branch, or one retargeted later, is still fully read).
          CONFIG_BRANCH: ${{ github.event.repository.default_branch }}
          PARENT_TOKEN: ${{ github.token }}
        # A push leaves out the commits upstream (this fork's parent, as in fork-follow.yml)
        # already has. Parent not readable: UPSTREAM stays empty and the full range is scanned.
        # The token reaches only the parent lookup, never the scan script or gitleaks.
        run: |
          set -euo pipefail
          UPSTREAM=""
          if [[ "$EVENT_NAME" == push ]]; then
            UPSTREAM="$(GH_TOKEN="$PARENT_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // empty' || true)"
          fi
          unset PARENT_TOKEN
          export UPSTREAM
          bash .github/scripts/fork-secret-scan.sh

  outside_pr:
    name: Outside pull request
    if: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse an outside pull request
        run: |
          echo "::error::outside PR: not tested here; a maintainer must review"
          exit 1
