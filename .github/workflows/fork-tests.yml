name: Fork tests

# Fork only. Upstream's CI checks (ci.yml) on GitHub-hosted runners, because the
# fork has none of upstream's runners and upstream's workflows are disabled here.
# Commands follow ci.yml step for step. Only the runners, time limits, apt
# setup and the task cache differ (kept with actions/cache instead of upstream's
# private remote cache), and Test and Test Web split over two runners each.
# Upstream's composite actions and change detector (.github/actions,
# .github/scripts/ci-changes.cjs) are used as they are, so a rebase brings their
# changes. The `workflows` job lints the fork workflows (actionlint) and fails
# when upstream's ci.yml or release.yml test jobs change and this copy did not
# follow (.github/scripts/fork-tests-drift.cjs).
#
# Require only `fork-ci-result` in a ruleset: it needs every other job, so jobs
# can be added, split or resharded without touching the ruleset.
#
# Runners: the `route` step of `changes` picks, per Linux job, this
# repository's own fleet or GitHub-hosted Ubuntu 24.04 (like upstream's runners,
# so an OS upgrade is a reviewed change here, not a surprise from
# ubuntu-latest). The setting is the repository variable CI_RUNNERS: auto
# (unset too), fleet or github; facts about the fleet are in
# .github/fork-fleet.json, the runbook in .github/fork-fleet.md. Only trusted
# runs may use the fleet (pushes to main and the owner's own pull requests from
# this repository): this repository is public, and a pull request from a fork
# must never run its code on a fleet machine. No fleet runner waits for work: a
# dispatcher on each fleet host reads GitHub's record of a run and starts a
# one-job runner only for a queued job of a trusted run that asks for the
# random label `route` made for it. So a changed workflow that names a fleet
# label finds no runner, and each runner's job-started hook kills any job but
# the one it was made for. The macOS job and the short jobs before and after the
# tests stay GitHub-hosted.
#
# Two modes:
# - pull_request / push to main: CI. Jobs a change cannot affect are skipped by
#   upstream's detector; every skip is named with its reason in the run summary.
# - workflow_call / workflow_dispatch with `ref`: release. Every Linux job runs
#   on that commit, no path filter. Covers release.yml's quality, test, test_web
#   and test_server (ci.yml checks a superset of them).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to test (resolved to one commit for every job)
        required: true
        type: string

permissions:
  contents: read

# A new push to a pull request cancels its older run. Main and release runs finish.
# The event name keeps a release's workflow_call apart from its caller's group.
concurrency:
  group: fork-tests-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job but two starts with the same condition: on a pull request, only one whose branch is in
# this repository. A pull request from another fork gets only `outside_pr`, which checks nothing
# out, runs nothing from the pull request, gets no token and fails, and `fork_ci_result`, which
# needs it and fails too: a job skipped by its if: counts as passed, so a required fork-ci-result
# never goes green on an outside pull request that nothing tested. A head repository GitHub no
# longer knows reads as "another fork". Test: fork-contracts.test.py.
#
# This condition stops only honest pull requests. Under pull_request GitHub runs the pull request's
# own copy of this file, so an outside pull request can delete the condition, or add a workflow of
# its own, and its code runs as soon as a maintainer approves the run. The real protection here is
# the repository's approval setting (approval for every outside contributor): keep it on, and never
# approve an outside pull request's run; push its branch to this repository after review instead.
# (fork-checks.yml is different: pull_request_target always runs main's copy.)
jobs:
  # Fails on purpose: an outside pull request is not tested here, see above.
  outside_pr:
    name: Outside pull request
    if: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse an outside pull request
        run: |
          echo "::error::outside PR: not tested here; a maintainer must review"
          exit 1

  changes:
    name: Changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Release runs: the commit every job checks out. Empty on pull_request and
      # push, where each checkout already takes the run's own commit.
      sha: ${{ steps.resolve.outputs.sha }}
      typecheck: ${{ steps.release.outputs.typecheck || steps.detect.outputs.typecheck }}
      build: ${{ steps.release.outputs.build || steps.detect.outputs.build }}
      desktop_launch: ${{ steps.release.outputs.desktop_launch || steps.detect.outputs.desktop_launch }}
      test: ${{ steps.release.outputs.test || steps.detect.outputs.test }}
      test_packages: ${{ steps.release.outputs.test_packages || steps.detect.outputs.test_packages }}
      test_web: ${{ steps.release.outputs.test_web || steps.detect.outputs.test_web }}
      test_server: ${{ steps.release.outputs.test_server || steps.detect.outputs.test_server }}
      rust: ${{ steps.release.outputs.rust || steps.detect.outputs.rust }}
      release_smoke: ${{ steps.release.outputs.release_smoke || steps.detect.outputs.release_smoke }}
      mobile_native: ${{ steps.release.outputs.mobile_native || steps.fork.outputs.mobile_native }}
      # Where each Linux job runs (the `route` step; empty in a release run, which is GitHub-hosted).
      runners: ${{ steps.route.outputs.runners }}
      fleet_mode: ${{ steps.route.outputs.mode }}
      fleet_attempt: ${{ steps.route.outputs.attempt }}
      fleet_watch: ${{ steps.route.outputs.watch || 'false' }}
    steps:
      - name: Checkout
        if: inputs.ref == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          sparse-checkout: |
            /pnpm-workspace.yaml
            /.github/scripts/ci-changes.cjs
            /.github/actions/ci-changes/
            /*/package.json
            /*/*/package.json
            /.github/fork-fleet.json
            /.github/scripts/fork-fleet.py
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Detect affected jobs
        id: detect
        if: inputs.ref == ''
        uses: ./.github/actions/ci-changes

      # ci-changes.cjs runs the macOS lint when upstream's ci.yml changes; the
      # fork's copy of it counts the same.
      - name: Fork workflow changes run the macOS lint
        id: fork
        if: inputs.ref == ''
        env:
          DETECTED: ${{ steps.detect.outputs.mobile_native }}
        run: |
          value="$DETECTED"
          if grep -qxE '\.github/workflows/fork-tests\.yml' "$RUNNER_TEMP/changed-paths" 2>/dev/null; then
            value=true
          fi
          echo "mobile_native=$value" >> "$GITHUB_OUTPUT"

      # A branch name is resolved once, here: jobs start minutes apart, and a
      # branch that moves in between would otherwise test two commits in one run.
      - name: Checkout the commit to test
        if: inputs.ref != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /package.json
          sparse-checkout-cone-mode: false

      - name: Resolve the commit to test
        id: resolve
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Testing $sha (from \`$REF\`) in every job."
          echo "Release run: every job tests \`$sha\` (from \`$REF\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Release runs test the whole commit. upstream's release.yml has no macOS lint.
      - name: Release run checks everything
        id: release
        if: inputs.ref != ''
        run: |
          for gate in typecheck build desktop_launch test test_web test_server rust release_smoke; do
            echo "$gate=true" >> "$GITHUB_OUTPUT"
          done
          echo "test_packages=" >> "$GITHUB_OUTPUT"
          echo "mobile_native=false" >> "$GITHUB_OUTPUT"

      # Where each Linux job below runs (.github/scripts/fork-fleet.py route). It
      # calls no API and never fails for the fleet: a pool counts only with a
      # fresh heartbeat (a repository variable its dispatcher writes), anything
      # unclear is GitHub-hosted with a note. A failed step fails `changes`; an
      # empty answer means GitHub-hosted. A re-run of failed jobs keeps this
      # answer only while the setting is still fleet; otherwise it is GitHub-hosted.
      # Each pool's heartbeat is passed by name: a toJSON of all variables would print the rest.
      - name: Route
        id: route
        if: inputs.ref == ''
        env:
          FLEET_MODE: ${{ vars.CI_RUNNERS }}
          FLEET_BEACON_PC: ${{ vars.FLEET_BEACON_PC }}
          FLEET_BEACON_VM: ${{ vars.FLEET_BEACON_VM }}
          GATES: ${{ toJSON(steps.detect.outputs) }}
        run: python3 -I .github/scripts/fork-fleet.py route

  # A fleet job that waits too long for its runner cancels the run with an
  # error (.github/scripts/fork-fleet.py watch): 10 minutes in auto mode (the
  # sweep then re-runs it GitHub-hosted), 120 in fleet mode. Only in a run
  # that sent a job to the fleet.
  fleet_watch:
    name: Fleet watch
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (needs.changes.outputs.fleet_watch == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /.github/fork-fleet.json
            /.github/scripts/fork-fleet.py
          sparse-checkout-cone-mode: false

      - name: Cancel the run if a fleet job waits too long
        env:
          FLEET_MODE: ${{ needs.changes.outputs.fleet_mode }}
          FLEET_RUNNERS: ${{ needs.changes.outputs.runners }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/fork-fleet.py watch

  # A broken fork workflow is red on its own pull request, and the fork copy
  # must follow upstream's test jobs: the drift check lists every job and step
  # upstream changed since the copy was last recorded.
  workflows:
    name: Workflow lint and upstream drift
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # scripts/: some tests are run by a script there (.github/fork-ci-tests.txt).
      # fork-ci/: the composite actions and their tests. fork-kit/: host kits and their tests.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /.github/
            /fork-ci/
            /fork-kit/
            /scripts/
          sparse-checkout-cone-mode: false

      # Pinned release, verified by checksum. Upstream's own workflows use runner
      # labels this fork does not have, so only the fork's workflows are linted.
      - name: Lint fork workflows (actionlint)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/fork-*.yml

      # Every test under .github/scripts, fork-ci and fork-kit, checked against .github/fork-ci-tests.txt:
      # the fork's tests run here, the others must be named by the job or script
      # that runs them. An unlisted test, or a listed one deleted from history,
      # fails; a listed one whose pull request has not merged yet is a note.
      - name: Fork script tests
        run: |
          if compgen -G '.github/scripts/fork-*.test.py' >/dev/null && ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          fi
          node .github/scripts/fork-ci-tests.cjs

      # The fleet launcher with real runner users (created and deleted by the test):
      # one slot's user cannot read another's copy, nothing a job leaves (files in
      # HOME, a running process) reaches the next job, root deletes nothing in a
      # directory a runner user can write, and check-net proves a runner's network
      # with real namespaces and the real nft table (hence nftables).
      - name: Install nftables for the launcher's network test
        run: command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables; }

      - name: Fleet launcher as root
        run: sudo env FORK_FLEET_ROOT_TESTS=1 python3 -B .github/scripts/fork-fleet.test.py LauncherAsRoot

      # The gh-apps host kit installed for real (fork-kit/gh-apps/README.md): real service
      # users, the real sudoers file and sudo, an agent user that tries to reach the keys,
      # the token cache, gh-mint and the environment. It creates and deletes its users and
      # refuses to run anywhere but a throw-away runner. sudo drops GITHUB_ACTIONS, so it is
      # passed on again.
      - name: gh-apps kit as root
        run: sudo env GH_APPS_ROOT_TESTS=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" python3 -I -B fork-kit/gh-apps/tests/root.test.py

      - name: Compare upstream's test jobs with the recorded copy
        run: node .github/scripts/fork-tests-drift.cjs

  # Every commit a pull request or a push to main adds, history included: a
  # secret committed and then deleted is still public. Release runs test a
  # commit that already passed this on its way to main, so they skip it.
  # The ranges, and why: .github/scripts/fork-secret-scan.sh.
  secrets:
    name: Secret scan
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.ref == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history without file contents. The scan script fetches the contents
      # of only the scanned commits (a failed fetch fails the job), then runs
      # gitleaks offline.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # The range rules against this gitleaks: a key added and deleted again
      # before a merge of main, a key only a merge commit adds, push ranges.
      - name: Test the scan ranges
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash .github/scripts/fork-secret-scan.test.sh

      - name: Scan the added commits
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PARENT_TOKEN: ${{ github.token }}
        # A push leaves out the commits upstream (this fork's parent, as in fork-follow.yml)
        # already has. Parent not readable: UPSTREAM stays empty and the full range is scanned.
        # The token reaches only the parent lookup, never the scan script or gitleaks.
        run: |
          set -euo pipefail
          UPSTREAM=""
          if [[ "$EVENT_NAME" == push ]]; then
            UPSTREAM="$(GH_TOKEN="$PARENT_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // empty' || true)"
          fi
          unset PARENT_TOKEN
          export UPSTREAM
          bash .github/scripts/fork-secret-scan.sh

  lint:
    name: Lint
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['lint'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['lint'][0], fromJSON(needs.changes.outputs.runners || '{}')['lint'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check unused code
        run: vp run knip:check

      - name: Check generated GitHub GraphQL operations
        run: vp run --filter @t3tools/source-control-github generate --check

      - name: Check generated Expo GraphQL operations
        run: vp run --filter t3 generate --check

      - name: Check
        run: vp check

  build:
    name: Build and Typecheck
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && (needs.changes.outputs.build != 'false' || needs.changes.outputs.typecheck != 'false')) }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['build'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['build'][0], fromJSON(needs.changes.outputs.runners || '{}')['build'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Runs in the background while Vite+ installs; the step before the build waits for it.
      # Xvfb is for the desktop launch check below.
      - name: Start installing browser secret helper build libraries
        if: needs.changes.outputs.build != 'false'
        run: |
          # A fleet runner has no sudo: its host must have the packages already.
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            if pkg-config --exists libsecret-1 && command -v xvfb-run >/dev/null; then
              echo 0 > "$RUNNER_TEMP/apt-status"
            else
              echo "This fleet runner's host lacks some of: libsecret-1-dev pkg-config xvfb (.github/fork-fleet.md)" > "$RUNNER_TEMP/apt.log"
              echo 1 > "$RUNNER_TEMP/apt-status"
            fi
          else
            (
              set +e
              sudo apt-get update -o Acquire::Languages=none \
                -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
                -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
                sudo apt-get install -y libsecret-1-dev pkg-config xvfb
              echo "$?" > "$RUNNER_TEMP/apt-status"
            ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &
          fi

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        id: electron
        run: vp run --filter @t3tools/desktop ensure:electron

      # Upstream reads a private remote task cache (a secret the fork has not
      # got). Here vp's local task cache is kept between runs instead: vp
      # fingerprints each task's inputs, so a restored entry only replays a
      # task whose inputs are unchanged. A new lockfile starts a fresh cache.
      - name: Cache vp tasks
        if: needs.changes.outputs.typecheck != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-v1-typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-${{ github.sha }}
          restore-keys: vp-tasks-v1-typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-

      # Runs in the background while the build runs, and reports in the last
      # step: neither result hides the other.
      - name: Start typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && needs.changes.outputs.typecheck != 'false' }}
        run: |
          (
            set +e
            vpr typecheck
            echo "$?" > "$RUNNER_TEMP/typecheck-status"
          ) > "$RUNNER_TEMP/typecheck.log" 2>&1 < /dev/null &

      - name: Finish installing browser secret helper build libraries
        id: apt
        if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      - name: Build desktop pipeline
        id: build
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && steps.apt.outcome == 'success' && needs.changes.outputs.build != 'false' }}
        run: vp run build:desktop

      - name: Verify preload bundle output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Open the seeded thread in the built desktop app
        id: desktop_launch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.desktop_launch != 'false' }}
        timeout-minutes: 4
        run: |
          electron=$(node -p "require('./apps/desktop/node_modules/electron')")
          xvfb-run -a node scripts/smoke-desktop-app.ts --executable "$electron" --app apps/desktop \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"

      - name: Upload desktop launch check
        if: ${{ failure() && steps.desktop_launch.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      - name: Resolve Playwright version
        id: playwright_version
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for the built web client boot check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' && steps.chromium_cache.outputs.cache-hit != 'true' }}
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Boot the built web client
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        timeout-minutes: 3
        run: node apps/web/scripts/verify-built-boot.ts

      - name: Typecheck
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          until test -s "$RUNNER_TEMP/typecheck-status"; do sleep 1; done
          cat "$RUNNER_TEMP/typecheck.log"
          exit "$(cat "$RUNNER_TEMP/typecheck-status")"

  # Everything except `t3` (apps/server) and the web app, which have their own jobs.
  # Upstream runs this on one large runner; one 4-CPU runner took 6 minutes.
  # Two runners split it (.github/scripts/fork-test-shards.cjs): each runs a
  # vitest slice of every large package and half of the others, whole.
  test:
    name: Test ${{ matrix.shard }}
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.test != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')[format('test-{0}', matrix.shard)][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')[format('test-{0}', matrix.shard)][0], fromJSON(needs.changes.outputs.runners || '{}')[format('test-{0}', matrix.shard)][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # A shard with nothing to run says so in the summary and stops here.
      - name: Pick this shard's packages
        id: shard
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: |
          work=$(node .github/scripts/fork-test-shards.cjs "${{ matrix.shard }}/${{ strategy.job-total }}")
          whole=$(awk '$1 == "whole" { printf "%s ", $2 }' <<< "$work")
          split=$(awk '$1 == "split" { printf "%s ", $2 }' <<< "$work")
          { echo "whole=${whole% }"; echo "split=${split% }"; echo "any=$([[ -n "$work" ]] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

      # The desktop tests compile the browser secret helper. The install runs in
      # the background while Vite+ installs; the step before the tests waits for it.
      - name: Start installing browser secret helper build libraries
        if: steps.shard.outputs.any == 'true'
        run: |
          # A fleet runner has no sudo: its host must have the packages already.
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            if pkg-config --exists libsecret-1; then
              echo 0 > "$RUNNER_TEMP/apt-status"
            else
              echo "This fleet runner's host lacks some of: libsecret-1-dev pkg-config (.github/fork-fleet.md)" > "$RUNNER_TEMP/apt.log"
              echo 1 > "$RUNNER_TEMP/apt-status"
            fi
          else
            (
              set +e
              sudo apt-get update -o Acquire::Languages=none \
                -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
                -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
                sudo apt-get install -y libsecret-1-dev pkg-config
              echo "$?" > "$RUNNER_TEMP/apt-status"
            ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &
          fi

      - name: Setup Vite+
        if: steps.shard.outputs.any == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Cache Electron download
        if: steps.shard.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        if: steps.shard.outputs.any == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test preview artifact validation
        if: matrix.shard == 1
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      # Upstream's ci.yml runs the first four; the fork adds thread-transfer-report,
      # which upstream runs from a workflow_run of its CI (disabled in the fork).
      - name: Test release checks
        if: matrix.shard == 1
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs .github/scripts/mobile-preview-comment.test.cjs .github/scripts/test-delta.test.cjs .github/scripts/thread-transfer-report.test.cjs

      - name: Finish installing browser secret helper build libraries
        if: steps.shard.outputs.any == 'true'
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      # Whole packages as upstream runs them; a large package's slice runs its
      # own test script in its directory with vitest's --shard (`vp run` does
      # not pass arguments through to vitest).
      - name: Test
        if: steps.shard.outputs.any == 'true'
        env:
          WHOLE: ${{ steps.shard.outputs.whole }}
          SPLIT: ${{ steps.shard.outputs.split }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          set -o pipefail
          # The runner's trace writer can crash on surrogate pairs in test output.
          ascii() {
            python3 -u -c '
          import sys
          for line in sys.stdin:
              sys.stdout.write(line.encode("ascii", "backslashreplace").decode("ascii"))
          '
          }
          status=0
          if [[ -n "$WHOLE" ]]; then
            filters=()
            for package in $WHOLE; do filters+=(--filter "$package"); done
            vp run --parallel --concurrency-limit 4 "${filters[@]}" test 2>&1 | ascii || status=1
          fi
          for dir in $SPLIT; do
            echo "::group::$dir slice $SHARD"
            script=$(jq -r .scripts.test "$dir/package.json")
            (cd "$dir" && eval "$script --shard=$SHARD") 2>&1 | ascii || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Upstream runs this on one large runner; on a 4-CPU runner the 548 files
  # took 7.5 minutes, so two runners each take a vitest slice.
  test_web:
    name: Test Web ${{ matrix.shard }}
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.test_web != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')[format('test_web-{0}', matrix.shard)][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')[format('test_web-{0}', matrix.shard)][0], fromJSON(needs.changes.outputs.runners || '{}')[format('test_web-{0}', matrix.shard)][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      # Upstream: `vp run --filter @t3tools/web test --shard N/total`. The same
      # script, run in its directory with the slice, as on the Test shards.
      # Upstream's release test_web also boots the built client on shard 1;
      # here the Build job does that, for CI and release runs alike.
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: apps/web
        run: eval "$(jq -r .scripts.test package.json) --shard=$SHARD"

  # apps/server runs its test files one at a time; shards spread them over
  # separate runners. As upstream, the shards run the change detector
  # themselves, so the steps follow ci.yml one for one; a shard the change
  # cannot affect says so in its summary. They wait for `changes` only for a
  # release run's resolved commit (seconds; every other job waits for it too).
  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')[format('test_server-{0}', matrix.shard)][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')[format('test_server-{0}', matrix.shard)][0], fromJSON(needs.changes.outputs.runners || '{}')[format('test_server-{0}', matrix.shard)][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Detect affected jobs
        id: changes
        if: inputs.ref == ''
        uses: ./.github/actions/ci-changes

      - name: Report skip
        if: steps.changes.outputs.test_server == 'false'
        run: |
          msg="Skipped: upstream's change detector found no change that affects t3 (apps/server)."
          echo "::notice title=Test Server ${{ matrix.shard }} skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Vite+
        if: steps.changes.outputs.test_server != 'false'
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      # Upstream reads a private remote task cache (a secret the fork has not
      # got). Here vp's local task cache is kept between runs instead: vp
      # fingerprints each task's inputs, so a restored entry only replays a
      # task whose inputs are unchanged. A new lockfile starts a fresh cache.
      - name: Cache vp tasks
        if: steps.changes.outputs.test_server != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-v1-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-${{ github.sha }}
          restore-keys: vp-tasks-v1-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-

      - name: Resolve Playwright version
        id: playwright_version
        if: steps.changes.outputs.test_server != 'false'
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        if: steps.changes.outputs.test_server != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for server browser integration tests
        if: steps.changes.outputs.test_server != 'false' && steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        if: steps.changes.outputs.test_server != 'false'
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      # As upstream: Vitest's module cache, saved only by pushes to main so
      # pull requests never evict each other's entries.
      - name: Restore Vitest module cache
        if: steps.changes.outputs.test_server != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Test
        if: steps.changes.outputs.test_server != 'false'
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          T3CODE_TRANSFER_BUDGET_SCENARIOS_PATH: ${{ runner.temp }}/thread-transfer-scenarios.json
        # As upstream: one process per file spends ~2s starting before its tests run; one file per
        # vCPU overlaps that.
        run: >-
          vp run test:cached -- --shard ${{ matrix.shard }}/${{ strategy.job-total }} --concurrency 4
          --uncached apps/server/integration/transferBudgetV2.integration.test.ts
          --verify-hits 1 apps/server

      - name: Save Vitest module cache
        if: github.event_name == 'push' && steps.changes.outputs.test_server != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      # integration/transferBudgetV2.integration.test.ts writes the report; exactly one shard
      # produces these files.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: thread-transfer-results
          path: |
            ${{ runner.temp }}/thread-transfer-result.json
            ${{ runner.temp }}/thread-transfer-scenarios.json
          if-no-files-found: ignore
          retention-days: 30

  rust:
    name: Rust
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.rust != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['rust'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['rust'][0], fromJSON(needs.changes.outputs.runners || '{}')['rust'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  # Upstream runs this on macOS 26. GitHub-hosted macOS minutes are free on a
  # public repository; it runs only for native mobile sources or a workflow change.
  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.mobile_native != 'false') }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.release_smoke != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['release_smoke'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['release_smoke'][0], fromJSON(needs.changes.outputs.runners || '{}')['release_smoke'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  # The one check a ruleset requires. Fails when any job fails or is cancelled,
  # or is skipped without a reason: `changes` said its gates were not needed,
  # or (secret scan) it is a release run. The summary lists every job, the
  # reason for every skip, and each job's wall time.
  # `always()` rather than `!cancelled()`: a skipped job reports success to
  # branch protection, so a cancelled run must still produce a failing result.
  fork_ci_result:
    name: fork-ci-result
    # Runs on every pull request, outside ones too (it checks nothing out), so that it fails there.
    if: ${{ always() }}
    needs:
      [
        outside_pr,
        changes,
        fleet_watch,
        workflows,
        secrets,
        lint,
        build,
        test,
        test_web,
        test_server,
        rust,
        mobile_native_static_analysis,
        release_smoke,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The job list API needs actions: read; nothing here checks out code.
    permissions:
      actions: read
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_RUN: ${{ inputs.ref != '' }}
          OUTSIDE_PR: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A jq program: $release is jq's variable, not the shell's.
          # shellcheck disable=SC2016
          why='{
            build: "the change affects neither desktop, server nor web, and no package needs a typecheck",
            test: "the change affects no package this job tests",
            test_web: "the change affects nothing @t3tools/web depends on",
            rust: "the change touches none of the native Rust crates",
            mobile_native_static_analysis: (if $release == "true"
              then "release run: upstream release.yml has no macOS lint"
              else "no native mobile source, Brewfile or CI workflow changed" end),
            release_smoke: "the change does not affect scripts/",
            secrets: "release run: the commit was scanned on its way to main",
            outside_pr: "not a pull request from another fork",
            fleet_watch: "no job of this run went to the fleet"
          }'
          {
            echo "### fork-ci-result"
            echo
            echo "| Job | Result | Why skipped |"
            echo "| --- | --- | --- |"
            echo "$RESULTS" | jq -r --arg release "$RELEASE_RUN" "$why as \$why
              | to_entries[]
              | \"| \(.key) | \(.value.result) | \(if .value.result == \"skipped\" then (\$why[.key] // \"no reason: fails\") else \"\" end) |\""
            if [[ "$(echo "$RESULTS" | jq -r '.changes.outputs.test_server')" == false ]]; then
              echo
              echo "Server shards passed without running tests: the change affects nothing t3 (apps/server) depends on."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # An outside pull request fails here whatever the other jobs did.
          if [[ "$OUTSIDE_PR" == true ]]; then
            echo "::error::outside PR: not tested here; a maintainer must review"
            exit 1
          fi
          # A job may skip only when `changes` said every gate it represents was
          # not needed (gates are keyed by job name, except merged Build and the
          # macOS lint), or, for the secret scan, in a release run. outside_pr
          # passes by being skipped (outside pull requests stopped above).
          echo "$RESULTS" | jq -e --arg release "$RELEASE_RUN" '.changes.outputs as $gates
            | {build: ["build", "typecheck", "desktop_launch"], mobile_native_static_analysis: ["mobile_native"]} as $renamed
            | all(to_entries[];
                if .key == "outside_pr" then .value.result == "skipped"
                else .value.result == "success"
                  or (.value.result == "skipped"
                    and (if .key == "secrets" then $release == "true"
                         else (($renamed[.key] // [.key]) | all(.[]; $gates[.] == "false")) end)) end)' > /dev/null

      # A run whose server tests ran must have produced the transfer measurements.
      - name: Require transfer measurements
        if: needs.test_server.result == 'success' && needs.changes.outputs.test_server != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer

      # Information only: read from the run's job list, never fails the run.
      - name: Job wall times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100") || {
            echo "::warning::Job timings unavailable: the job list API call failed."
            echo "Job timings unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          echo "Job timings for $(echo "$jobs" | jq '.jobs | length') jobs."
          {
            echo
            echo "#### Job wall times"
            echo
            echo "| Job | Queued | Ran |"
            echo "| --- | ---: | ---: |"
            echo "$jobs" | jq -r '.jobs[]
              | select(.completed_at != null and .started_at != null)
              | ((.started_at | fromdateiso8601) - (.created_at | fromdateiso8601)) as $queued
              | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) as $ran
              | "| \(.name) | \($queued)s | \($ran / 60 | floor)m \($ran % 60)s |"'
          } >> "$GITHUB_STEP_SUMMARY"
