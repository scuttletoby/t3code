name: Fork tests

# Fork only. Upstream's CI checks (ci.yml) on GitHub-hosted runners, because the
# fork has none of upstream's runners and upstream's workflows are disabled here.
# Commands follow ci.yml step for step. Only the runners, time limits, apt
# setup and the task cache differ (kept with actions/cache instead of upstream's
# private remote cache), Test splits over two runners and Test Web over three.
# Test and Test Web also keep Vitest's module cache as upstream's Test Server does,
# and Rust keeps cargo's build output; .github/scripts/fork-ci-cache-keys.cjs
# checks every cache key here (lockfile hashes, push-only saves).
# Upstream's composite actions and change detector (.github/actions,
# .github/scripts/ci-changes.cjs) are used as they are, so a rebase brings their
# changes. The `workflows` job lints the fork workflows (actionlint) and the
# fleet launcher (shellcheck), and fails
# when upstream's ci.yml or release.yml test jobs change and this copy did not
# follow (.github/scripts/fork-tests-drift.cjs). The fork's own script tests run
# side by side in `workflows`, `action_tests`, the `kit_tests` shards and
# `kit_root_tests`.
#
# Require only `fork-ci-result` in a ruleset: it needs every other job, so jobs
# can be added, split or resharded without touching the ruleset.
#
# Runners: the `route` step of `changes` picks, per Linux job, this
# repository's own fleet or GitHub-hosted Ubuntu 24.04 (like upstream's runners,
# so an OS upgrade is a reviewed change here, not a surprise from
# ubuntu-latest). The setting is the repository variable CI_RUNNERS: auto
# (unset too), fleet or github; facts about the fleet are in
# .github/fork-fleet.json, the runbook in .github/fork-fleet.md. Only trusted
# runs may use the fleet (pushes to main and the owner's own pull requests from
# this repository): this repository is public, and a pull request from a fork
# must never run its code on a fleet machine. No fleet runner waits for work: a
# dispatcher on each fleet host reads GitHub's record of a run and starts a
# one-job runner only for a queued job of a trusted run that asks for the
# random label `route` made for it. So a changed workflow that names a fleet
# label finds no runner, and each runner's job-started hook kills any job but
# the one it was made for. The macOS job and the short jobs before and after the
# tests stay GitHub-hosted.
#
# Two modes:
# - pull_request / push to main: CI. Jobs a change cannot affect are skipped by
#   upstream's detector; every skip is named with its reason in the run summary.
# - workflow_call / workflow_dispatch with `ref`: release. Every Linux job runs
#   on that commit, no path filter. Covers release.yml's quality, test, test_web
#   and test_server (ci.yml checks a superset of them).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to test (resolved to one commit for every job)
        required: true
        type: string

permissions:
  contents: read

# A new push to a pull request cancels its older run (one group per pull request). Every other run
# (push to main, workflow_dispatch with `ref`, workflow_call from a release) has a group of its own,
# named by its run id, so it never cancels, queues behind or is cancelled by another run: GitHub
# keeps one waiting run per group and a newer one would cancel it, even without cancel-in-progress.
# `inputs.ref` is set only by workflow_call and workflow_dispatch, so a call from a caller that runs
# on pull_request is never put in the pull request's group. A called run's run id is its caller's.
# The secret scan does not depend on this: fork-secret-scan.yml also runs on its own for each push.
# Test: fork-contracts.test.py (tests-concurrency).
concurrency:
  group: fork-tests-${{ github.event_name == 'pull_request' && !inputs.ref && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.ref }}

# Every job but two starts with the same condition: on a pull request, only one whose branch is in
# this repository. A pull request from another fork gets only `outside_pr`, which checks nothing
# out, runs nothing from the pull request, gets no token and fails, and `fork_ci_result`, which
# needs it and fails too: a job skipped by its if: counts as passed, so a required fork-ci-result
# never goes green on an outside pull request that nothing tested. A head repository GitHub no
# longer knows reads as "another fork". Test: fork-contracts.test.py.
#
# This condition stops only honest pull requests. Under pull_request GitHub runs the pull request's
# own copy of this file, so an outside pull request can delete the condition, or add a workflow of
# its own, and its code runs as soon as a maintainer approves the run. The real protection here is
# the repository's approval setting (approval for every outside contributor): keep it on, and never
# approve an outside pull request's run; push its branch to this repository after review instead.
# (fork-checks.yml is different: pull_request_target always runs the base branch's copy.)
jobs:
  # Fails on purpose: an outside pull request is not tested here, see above.
  outside_pr:
    name: Outside pull request
    if: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse an outside pull request
        run: |
          echo "::error::outside PR: not tested here; a maintainer must review"
          exit 1

  changes:
    name: Changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Release runs: the commit every job checks out. Empty on pull_request and
      # push, where each checkout already takes the run's own commit.
      sha: ${{ steps.resolve.outputs.sha }}
      typecheck: ${{ steps.release.outputs.typecheck || steps.fork_only.outputs.typecheck || steps.detect.outputs.typecheck }}
      build: ${{ steps.release.outputs.build || steps.fork_only.outputs.build || steps.detect.outputs.build }}
      desktop_launch: ${{ steps.release.outputs.desktop_launch || steps.fork_only.outputs.desktop_launch || steps.detect.outputs.desktop_launch }}
      test: ${{ steps.release.outputs.test || steps.fork_only.outputs.test || steps.detect.outputs.test }}
      test_packages: ${{ steps.release.outputs.test_packages || steps.fork_only.outputs.test_packages || steps.detect.outputs.test_packages }}
      test_web: ${{ steps.release.outputs.test_web || steps.fork_only.outputs.test_web || steps.detect.outputs.test_web }}
      test_server: ${{ steps.release.outputs.test_server || steps.fork_only.outputs.test_server || steps.detect.outputs.test_server }}
      rust: ${{ steps.release.outputs.rust || steps.fork_only.outputs.rust || steps.detect.outputs.rust }}
      release_smoke: ${{ steps.release.outputs.release_smoke || steps.fork_only.outputs.release_smoke || steps.detect.outputs.release_smoke }}
      # The `fork` step takes the fork_only step's answer (else the detector's) and adds the fork's own rule.
      mobile_native: ${{ steps.release.outputs.mobile_native || steps.fork.outputs.mobile_native }}
      # 'true' only on a pull request whose every changed path is fork-owned (the `fork_only` step); its
      # gates also come first on a pull request with only some paths fork-owned (those are left out).
      fork_only: ${{ steps.fork_only.outputs.fork_only || 'false' }}
      # Where each Linux job runs (the `route` step; empty in a release run, which is GitHub-hosted).
      runners: ${{ steps.route.outputs.runners }}
      fleet_mode: ${{ steps.route.outputs.mode }}
      fleet_attempt: ${{ steps.route.outputs.attempt }}
      fleet_watch: ${{ steps.route.outputs.watch || 'false' }}
      # The memory pressure probe's time limit in seconds (fork-ci-pressure.py, the first and last step of each
      # app job), here only. fork-ci-rerun.py reads no note from a job whose end step took this long
      # (.github/fork-ci-rerun.json probe_limit_seconds is the same number: fork-ci-pressure.test.py).
      probe_seconds: "40"
    steps:
      - name: Checkout
        if: inputs.ref == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          sparse-checkout: |
            /pnpm-workspace.yaml
            /.github/scripts/ci-changes.cjs
            /.github/actions/ci-changes/
            /.github/fork-owned-paths.txt
            /.github/scripts/fork-owned-paths.cjs
            /*/package.json
            /*/*/package.json
            /.github/fork-fleet.json
            /.github/scripts/fork-fleet.py
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Detect affected jobs
        id: detect
        if: inputs.ref == ''
        uses: ./.github/actions/ci-changes

      # A pull request that changes only fork-owned paths (.github/fork-owned-paths.txt: fork-ci/, fork-kit/, the
      # fork's own .github scripts) skips the app jobs: its gates are upstream's detector's answer for a change with
      # no path left, all false. One that changes some fork-owned paths gets the detector's answer for the other
      # paths alone (no app job reads a fork-owned path, and the detector runs every job for a path it does not
      # know). Anything unclear keeps the detector's answer (.github/scripts/fork-owned-paths.cjs).
      # Pull requests into main only (a stacked one compares with its parent; a retarget starts no new run).
      - name: Fork-only pull request
        id: fork_only
        if: inputs.ref == '' && github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        run: node .github/scripts/fork-owned-paths.cjs >> "$GITHUB_OUTPUT"

      # ci-changes.cjs runs the macOS lint when upstream's ci.yml changes; the
      # fork's copy of it counts the same. Starts from the fork_only step's answer when it gave one.
      - name: Fork workflow changes run the macOS lint
        id: fork
        if: inputs.ref == ''
        env:
          DETECTED: ${{ steps.fork_only.outputs.mobile_native || steps.detect.outputs.mobile_native }}
        run: |
          value="$DETECTED"
          if grep -qxE '\.github/workflows/fork-tests\.yml' "$RUNNER_TEMP/changed-paths" 2>/dev/null; then
            value=true
          fi
          echo "mobile_native=$value" >> "$GITHUB_OUTPUT"

      # A branch name is resolved once, here: jobs start minutes apart, and a
      # branch that moves in between would otherwise test two commits in one run.
      - name: Checkout the commit to test
        if: inputs.ref != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /package.json
          sparse-checkout-cone-mode: false

      - name: Resolve the commit to test
        id: resolve
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Testing $sha (from \`$REF\`) in every job."
          echo "Release run: every job tests \`$sha\` (from \`$REF\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Release runs test the whole commit. upstream's release.yml has no macOS lint.
      - name: Release run checks everything
        id: release
        if: inputs.ref != ''
        run: |
          for gate in typecheck build desktop_launch test test_web test_server rust release_smoke; do
            echo "$gate=true" >> "$GITHUB_OUTPUT"
          done
          echo "test_packages=" >> "$GITHUB_OUTPUT"
          echo "mobile_native=false" >> "$GITHUB_OUTPUT"

      # Where each Linux job below runs (.github/scripts/fork-fleet.py route). It
      # calls no API and never fails for the fleet: a pool counts only with a
      # fresh heartbeat (a repository variable its dispatcher writes), anything
      # unclear is GitHub-hosted with a note. A failed step fails `changes`; an
      # empty answer means GitHub-hosted. A re-run of failed jobs keeps this
      # answer only while the setting is still fleet; otherwise it is GitHub-hosted.
      # Each pool's heartbeat is passed by name: a toJSON of all variables would print the rest.
      - name: Route
        id: route
        if: inputs.ref == ''
        env:
          FLEET_MODE: ${{ vars.CI_RUNNERS }}
          FLEET_BEACON_PC: ${{ vars.FLEET_BEACON_PC }}
          FLEET_BEACON_VM: ${{ vars.FLEET_BEACON_VM }}
          GATES: ${{ steps.fork_only.outputs.typecheck && toJSON(steps.fork_only.outputs) || toJSON(steps.detect.outputs) }}
        run: python3 -I .github/scripts/fork-fleet.py route

  # A fleet job that waits too long for its runner cancels the run with an
  # error (.github/scripts/fork-fleet.py watch): 10 minutes in auto mode (the
  # sweep then re-runs it GitHub-hosted), 120 in fleet mode. Only in a run
  # that sent a job to the fleet.
  fleet_watch:
    name: Fleet watch
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (needs.changes.outputs.fleet_watch == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /.github/fork-fleet.json
            /.github/scripts/fork-fleet.py
          sparse-checkout-cone-mode: false

      - name: Cancel the run if a fleet job waits too long
        env:
          FLEET_MODE: ${{ needs.changes.outputs.fleet_mode }}
          FLEET_RUNNERS: ${{ needs.changes.outputs.runners }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/fork-fleet.py watch

  # fork-checks.yml runs on pull_request_target, which GitHub blocks unless the repository's Actions
  # policy allows it (#401, .github/fork-actions-policies.json); its checks are not required, so a
  # blocked, failed or cancelled run would pass unseen. This job waits (capped) for its check run on
  # the pull request's head to pass, in a run of this pull request (PR_NUMBER, #433), judged by the
  # config on the pull request's base commit (#430), and fork_ci_result needs it. Other events: a called run (release) logs a skip; a direct run passes
  # only on the default branch. Checks out without a token (the shared plain-git step: actions/checkout
  # with persist-credentials: false fails on upstream's gitlinks); the script fetches the base commit.
  # fork-contracts.test.py pins this job (if, env, steps, no continue-on-error) and checks its worst case
  # fits the job timeout: the checkout step's own timeout + the wait cap (or the script's git calls, if
  # longer) + one last poll + 1 min for the job's set-up (today 3 + 10 + 1 + 1 = 15 min of 15, #449; a worst case
  # of exactly the timeout would be cancelled before the message). The checkout's timeout makes a slow fetch fail
  # as a timed-out Checkout step, not as a job cancelled before the script's message.
  # The checkout and the base fetch use no token, so this job works only in a public repository.
  fork_checks_ran:
    name: Fork checks ran
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The run and job lists need actions: read (a job is a check run; every caller grants it).
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        shell: bash
        timeout-minutes: 3
        env:
          REF: ${{ github.sha }}
          HISTORY: tip
          SPARSE: /.github/scripts/
        run: |
          set -euo pipefail
          [[ -n "$REF" ]] || { echo "::error::No commit or branch to check out." >&2; exit 1; }
          case "$HISTORY" in
            full) history=(--filter=blob:none) ;;
            tip) history=(--depth=1 --filter=blob:none) ;;
            *) echo "::error::HISTORY is full or tip, not '$HISTORY'." >&2; exit 1 ;;
          esac
          read -r -a sparse <<< "$SPARSE"
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          # A name is a branch, fetched as refs/heads/<name>: a bare name would take a tag of the same
          # name first.
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then src="$REF"; else src="refs/heads/$REF"; fi
          git fetch -q --no-tags --no-recurse-submodules "${history[@]}" origin "$src"
          if (( ${#sparse[@]} )); then git sparse-checkout set --no-cone "${sparse[@]}"; fi
          git checkout -q --detach FETCH_HEAD

      - name: Require fork-checks to pass on the head commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTSIDE_PR: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/fork-checks-ran.py

  # A broken fork workflow is red on its own pull request, and the fork copy
  # must follow upstream's test jobs: the drift check lists every job and step
  # upstream changed since the copy was last recorded.
  workflows:
    name: Workflow lint and upstream drift
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # scripts/: some tests are run by a script there (.github/fork-ci-tests.txt).
      # fork-ci/: the composite actions and their tests. fork-kit/: host kits and their tests.
      # docs/fork/: the fork's pages whose commands and links a test runs (fork-gate-trust-docs.test.py).
      # apps/, packages/: only the T3 source files the kits' contract tests pin
      # (fork-kit/golive/tests/contract.test.py; UsagePacingGate.ts: the effort option ids and
      # model.ts: the ultracode mapping, ModelManifest.ts and model-manifest.json: T3's model list and its
      # cache, builtInDrivers.ts, the drivers' kind files and the files where each reads its effort
      # (claudeModelOptions.ts, the adapters) and Kiro's agent id (acpSupport.ts): the effort id of each
      # built-in driver, in fork-kit/model-guard/tests/guard.test.py; modelPolicy.ts: the server's model
      # policy reads the same effort ids, same test); packages/shared/src/capacity/: the capacity rule's one
      # source, which the heavy kit's evaluator and its tests read and heavy-install copies
      # (fork-kit/heavy/tests/capacity_rule.test.py, facts.test.py, install.test.py); keep the lists in step.
      # The workspace files (pnpm-workspace.yaml, the package.json files) are what fork-owned-paths.cjs narrows a
      # partly fork-owned change with, as in `changes`; fork-owned-paths.test.py runs it here.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          # Two commits: on a pull request, the merge commit and its base (the seam check).
          fetch-depth: 2
          sparse-checkout: |
            /.github/
            /docs/fork/
            /fork-ci/
            /fork-kit/
            /scripts/
            /apps/server/src/auth/EnvironmentAuth.ts
            /apps/server/src/claudeModelOptions.ts
            /apps/server/src/cli/auth.ts
            /apps/server/src/cli/config.ts
            /apps/server/src/cli/forkReport.ts
            /apps/server/src/cli/server.ts
            /apps/server/src/cli/servicePreflight.ts
            /apps/server/src/cli/sshHelper.ts
            /apps/server/src/cli/update.ts
            /apps/server/src/cloud/bootService.ts
            /apps/server/src/cloud/pinnedRuntime.ts
            /apps/server/src/cloud/servicePreflight.ts
            /apps/server/src/cloud/serviceProtocol.ts
            /apps/server/src/config.ts
            /apps/server/src/desktopUpdate/DesktopUpdateMarker.ts
            /apps/server/src/golive/forkReport.ts
            /apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
            /apps/server/src/persistence/Sqlite.ts
            /apps/server/src/provider/Drivers/AntigravityDriver.ts
            /apps/server/src/provider/Drivers/ClaudeDriver.ts
            /apps/server/src/provider/Drivers/CodexDriver.ts
            /apps/server/src/provider/ModelManifest.ts
            /apps/server/src/provider/builtInDrivers.ts
            /apps/server/src/provider/model-manifest.json
            /apps/server/src/serverOwnership.ts
            /apps/server/src/serverRuntimeState.ts
            /apps/server/src/serviceLauncher.ts
            /apps/server/src/usage/UsagePacingGate.ts
            /packages/contracts/src/desktopBootstrap.ts
            /packages/contracts/src/modelPolicy.ts
            /packages/provider-acp-registry/src/client.ts
            /packages/provider-cursor/src/client.ts
            /packages/provider-fx/src/client.ts
            /packages/provider-fx/src/server/acpSupport.ts
            /packages/provider-grok/src/client.ts
            /packages/provider-grok/src/server/adapter.ts
            /packages/provider-kiro/src/client.ts
            /packages/provider-kiro/src/server/acpSupport.ts
            /packages/provider-kiro/src/server/adapter.ts
            /packages/provider-muse/src/client.ts
            /packages/provider-muse/src/server/adapter.ts
            /packages/provider-opencode/src/client.ts
            /packages/provider-opencode/src/server/OpenCodeRuntime.ts
            /packages/provider-opencode/src/server/adapter.ts
            /packages/provider-opencode/src/server/v2/adapter.ts
            /packages/provider-pi/src/client.ts
            /packages/provider-pi/src/server/adapter.ts
            /packages/shared/src/capacity/
            /packages/shared/src/cliRelease.ts
            /packages/shared/src/model.ts
            /packages/ssh/src/tunnel.ts
            /pnpm-workspace.yaml
            /*/package.json
            /*/*/package.json
            !/.repos/
          sparse-checkout-cone-mode: false

      # Pinned release, verified by checksum. Upstream's own workflows use runner
      # labels this fork does not have, so only the fork's workflows are linted.
      - name: Lint fork workflows (actionlint)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/fork-*.yml

      # The fleet launcher runs as root on each fleet host: every shellcheck finding is fixed or
      # disabled with its reason there (#667). Pinned release, verified by checksum, as a fleet
      # runner need not have it; a few seconds.
      - name: Lint the fleet launcher (shellcheck)
        env:
          VERSION: 0.10.0
          SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          archive="shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "shellcheck-v${VERSION}/shellcheck"
          "$RUNNER_TEMP/shellcheck-v${VERSION}/shellcheck" .github/scripts/fork-fleet-launch.sh

      # The tests under .github/scripts, checked against .github/fork-ci-tests.txt (the fork-kit/
      # ones run in kit_tests, the fork-ci/ and fleet walls' ones in action_tests, beside this job):
      # the fork's tests run here, longest first by their weight in the list; the others must be
      # named by the job or script that runs them. An unlisted test, or a listed one deleted from
      # history, fails; a listed one whose pull request has not merged yet is a note. Every test is
      # in exactly one job's part (fork-ci-tests.test.cjs).
      # A step that runs fork tests is only their command (fork-contracts.test.py, quiet), so the set-up
      # is a step of its own.
      - name: Install PyYAML
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          fi
      # fork-fleet-refresh.test.py runs the refresh service's sandbox for real, as a transient unit of the runner
      # user's systemd manager. Ubuntu 24.04's AppArmor keeps unprivileged user namespaces from that manager, so it
      # would apply no sandbox and the test would skip (red: no test of it may skip). Allowed here, so the test runs
      # whatever the runner image's default; a kernel without the switch has no such restriction.
      - name: Let the user manager apply a services sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Fork script tests
        env:
          FORK_CI_TEST_RECORDS: ${{ runner.temp }}/fork-test-records
        run: node .github/scripts/fork-ci-tests.cjs '!fork-kit/' '!fork-ci/' '!.github/scripts/fork-fleet-walls'

      # The fleet launcher with real runner users (created and deleted by the test):
      # one slot's user cannot read another's copy, nothing a job leaves (files in
      # HOME, a running process) reaches the next job, root deletes nothing in a
      # directory a runner user can write, and check-net proves a runner's network
      # with real namespaces and the real nft table (hence nftables).
      - name: Install nftables for the launcher's network test
        run: command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables; }

      # The test file's own run (its `fork-ci: run` line: as root, FORK_FLEET_ROOT_TESTS=1, only LauncherAsRoot, -v so
      # the log names every test); none of its tests may skip.
      - name: Fleet launcher as root
        env:
          FORK_CI_TEST_RECORDS: ${{ runner.temp }}/fork-test-records
        run: node .github/scripts/fork-ci-tests.cjs --run .github/scripts/fork-fleet.test.py
      # What each fork test of this job ran (fork-ci-tests.cjs's records), for fork-ci-result, keyed by job, leg and
      # attempt so no other job's, leg's or attempt's records can stand in; none fails the job (fork-contracts.test.py).
      - name: Upload the fork test records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-test-records-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-test-records/
          if-no-files-found: error
          retention-days: 7

      - name: Compare upstream's test jobs with the recorded copy
        run: node .github/scripts/fork-tests-drift.cjs

      # Fork lines in upstream files stay the seam lines pinned in .github/fork-seams.json (a fork
      # setting goes in forkSettings.ts, not upstream's settings.ts). A pull request's run checks out
      # its merge commit, whose first parent is the base: the lines the pull request adds. Its two
      # commits have no upstream base, so the seam entries it changes are counted from upstream by
      # fork-checks (the pull request's head, full history), not here: --no-upstream.
      - name: Fork lines in upstream files
        if: ${{ github.event_name == 'pull_request' }}
        run: node .github/scripts/fork-seam-check.cjs --no-upstream HEAD^1 HEAD

  # The composite actions' tests (fork-ci/) and the fleet walls' (.github/scripts/fork-fleet-walls*),
  # split from `workflows`: together they were about two thirds of its script tests' time, which
  # is CPU-bound (all tests at once on the runner's cores), so `workflows` took 3 to 6 minutes.
  action_tests:
    name: Fork action and fleet walls tests
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The same files and depth as in `workflows` (its comment says why each), where these tests ran.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 2
          sparse-checkout: |
            /.github/
            /docs/fork/
            /fork-ci/
            /fork-kit/
            /scripts/
            /apps/server/src/auth/EnvironmentAuth.ts
            /apps/server/src/claudeModelOptions.ts
            /apps/server/src/cli/auth.ts
            /apps/server/src/cli/config.ts
            /apps/server/src/cli/forkReport.ts
            /apps/server/src/cli/server.ts
            /apps/server/src/cli/servicePreflight.ts
            /apps/server/src/cli/sshHelper.ts
            /apps/server/src/cloud/bootService.ts
            /apps/server/src/cloud/servicePreflight.ts
            /apps/server/src/cloud/serviceProtocol.ts
            /apps/server/src/config.ts
            /apps/server/src/desktopUpdate/DesktopUpdateMarker.ts
            /apps/server/src/golive/forkReport.ts
            /apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
            /apps/server/src/persistence/Sqlite.ts
            /apps/server/src/provider/Drivers/AntigravityDriver.ts
            /apps/server/src/provider/Drivers/ClaudeDriver.ts
            /apps/server/src/provider/Drivers/CodexDriver.ts
            /apps/server/src/provider/ModelManifest.ts
            /apps/server/src/provider/builtInDrivers.ts
            /apps/server/src/provider/model-manifest.json
            /apps/server/src/serverOwnership.ts
            /apps/server/src/serverRuntimeState.ts
            /apps/server/src/serviceLauncher.ts
            /apps/server/src/usage/UsagePacingGate.ts
            /packages/contracts/src/desktopBootstrap.ts
            /packages/contracts/src/modelPolicy.ts
            /packages/provider-acp-registry/src/client.ts
            /packages/provider-cursor/src/client.ts
            /packages/provider-fx/src/client.ts
            /packages/provider-fx/src/server/acpSupport.ts
            /packages/provider-grok/src/client.ts
            /packages/provider-grok/src/server/adapter.ts
            /packages/provider-kiro/src/client.ts
            /packages/provider-kiro/src/server/acpSupport.ts
            /packages/provider-kiro/src/server/adapter.ts
            /packages/provider-muse/src/client.ts
            /packages/provider-muse/src/server/adapter.ts
            /packages/provider-opencode/src/client.ts
            /packages/provider-opencode/src/server/OpenCodeRuntime.ts
            /packages/provider-opencode/src/server/adapter.ts
            /packages/provider-opencode/src/server/v2/adapter.ts
            /packages/provider-pi/src/client.ts
            /packages/provider-pi/src/server/adapter.ts
            /packages/shared/src/capacity/
            /packages/shared/src/cliRelease.ts
            /packages/shared/src/model.ts
            /packages/ssh/src/tunnel.ts
          sparse-checkout-cone-mode: false

      # These tests, checked against .github/fork-ci-tests.txt as in `workflows`.
      - name: Install PyYAML
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          fi
      - name: Fork action and fleet walls tests
        env:
          FORK_CI_TEST_RECORDS: ${{ runner.temp }}/fork-test-records
        run: node .github/scripts/fork-ci-tests.cjs fork-ci/ .github/scripts/fork-fleet-walls
      # What each fork test of this job ran (fork-ci-tests.cjs's records), for fork-ci-result, keyed by job, leg and
      # attempt so no other job's, leg's or attempt's records can stand in; none fails the job (fork-contracts.test.py).
      - name: Upload the fork test records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-test-records-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-test-records/
          if-no-files-found: error
          retention-days: 7

  # The host kits' tests (fork-kit/), split from `workflows` so the fork's script tests run
  # side by side: one job of all of them was the longest in the run. They are CPU-bound (every
  # file at once on the runner's cores), so they are split again into shards of about equal
  # weight (the ~Ns weights in .github/fork-ci-tests.txt; a weight far from a file's time fails
  # the shard that ran it, so the split stays even). One job of them reached 8 to 9 minutes of
  # its 10. More shards: add a number here; nothing else names them.
  kit_tests:
    name: Fork kit tests ${{ matrix.shard }}
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # The same files as in `workflows` (its comment says why each); the kits' tests read some.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          # Two commits: on a pull request, the merge commit and its base, so fork-ci-tests.cjs can see which files
          # the pull request changes (a weight note on a test it did not touch only warns).
          fetch-depth: 2
          sparse-checkout: |
            /.github/
            /docs/fork/
            /fork-ci/
            /fork-kit/
            /scripts/
            /apps/server/src/auth/EnvironmentAuth.ts
            /apps/server/src/claudeModelOptions.ts
            /apps/server/src/cli/auth.ts
            /apps/server/src/cli/config.ts
            /apps/server/src/cli/forkReport.ts
            /apps/server/src/cli/server.ts
            /apps/server/src/cli/servicePreflight.ts
            /apps/server/src/cli/sshHelper.ts
            /apps/server/src/cli/update.ts
            /apps/server/src/cloud/bootService.ts
            /apps/server/src/cloud/pinnedRuntime.ts
            /apps/server/src/cloud/servicePreflight.ts
            /apps/server/src/cloud/serviceProtocol.ts
            /apps/server/src/config.ts
            /apps/server/src/desktopUpdate/DesktopUpdateMarker.ts
            /apps/server/src/golive/forkReport.ts
            /apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
            /apps/server/src/persistence/Sqlite.ts
            /apps/server/src/provider/Drivers/AntigravityDriver.ts
            /apps/server/src/provider/Drivers/ClaudeDriver.ts
            /apps/server/src/provider/Drivers/CodexDriver.ts
            /apps/server/src/provider/ModelManifest.ts
            /apps/server/src/provider/builtInDrivers.ts
            /apps/server/src/provider/model-manifest.json
            /apps/server/src/serverOwnership.ts
            /apps/server/src/serverRuntimeState.ts
            /apps/server/src/serviceLauncher.ts
            /apps/server/src/usage/UsagePacingGate.ts
            /packages/contracts/src/desktopBootstrap.ts
            /packages/contracts/src/modelPolicy.ts
            /packages/provider-acp-registry/src/client.ts
            /packages/provider-cursor/src/client.ts
            /packages/provider-fx/src/client.ts
            /packages/provider-fx/src/server/acpSupport.ts
            /packages/provider-grok/src/client.ts
            /packages/provider-grok/src/server/adapter.ts
            /packages/provider-kiro/src/client.ts
            /packages/provider-kiro/src/server/acpSupport.ts
            /packages/provider-kiro/src/server/adapter.ts
            /packages/provider-muse/src/client.ts
            /packages/provider-muse/src/server/adapter.ts
            /packages/provider-opencode/src/client.ts
            /packages/provider-opencode/src/server/OpenCodeRuntime.ts
            /packages/provider-opencode/src/server/adapter.ts
            /packages/provider-opencode/src/server/v2/adapter.ts
            /packages/provider-pi/src/client.ts
            /packages/provider-pi/src/server/adapter.ts
            /packages/shared/src/capacity/
            /packages/shared/src/cliRelease.ts
            /packages/shared/src/model.ts
            /packages/ssh/src/tunnel.ts
          sparse-checkout-cone-mode: false

      # This shard's share of the tests under fork-kit, checked against .github/fork-ci-tests.txt
      # as in `workflows`.
      - name: Fork kit tests
        env:
          FORK_CI_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          FORK_CI_TEST_RECORDS: ${{ runner.temp }}/fork-test-records
        run: node .github/scripts/fork-ci-tests.cjs fork-kit/
      # What each fork test of this job ran (fork-ci-tests.cjs's records), for fork-ci-result, keyed by job, leg and
      # attempt so no other job's, leg's or attempt's records can stand in; none fails the job (fork-contracts.test.py).
      - name: Upload the fork test records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-test-records-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-test-records/
          if-no-files-found: error
          retention-days: 7

  # The kits' tests that need root or a real systemd user manager, on their own runner: they
  # change the machine (users, sudoers, linger), and beside the shards they add no time.
  kit_root_tests:
    name: Fork kit tests as root
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Both tests read only their kits, and the heavy kit the capacity rule it shares with the app (#866: without
      # it every job without --kind refuses, as heavy-install's copy would); the runner reads the list (and the
      # tests' `fork-ci:` lines) and runs each Python test through fork-ci-unittest.py (a node test with
      # fork-ci-node-counts.cjs).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /fork-kit/
            /packages/shared/src/capacity/
            /.github/fork-ci-tests.txt
            /.github/scripts/fork-ci-tests.cjs
            /.github/scripts/fork-ci-unittest.py
            /.github/scripts/fork-ci-node-counts.cjs
          sparse-checkout-cone-mode: false

      # The gh-apps host kit installed for real (fork-kit/gh-apps/README.md): real service
      # users, the real sudoers file and sudo, an agent user that tries to reach the keys,
      # the token cache, gh-mint and the environment. It creates and deletes its users and
      # refuses to run anywhere but a throw-away runner. Its own run (its `fork-ci: run` line: as
      # root, GH_APPS_ROOT_TESTS=1; the runner hands GITHUB_ACTIONS on, which sudo drops).
      - name: gh-apps kit as root
        env:
          FORK_CI_TEST_RECORDS: ${{ runner.temp }}/fork-test-records
        run: node .github/scripts/fork-ci-tests.cjs --run fork-kit/gh-apps/tests/root.test.py

      # The heavy kit's wrapper with a real systemd user manager (fork-kit/heavy/README.md):
      # linger starts the runner user's manager, and the slice gets a unit with a memory
      # limit (heavy refuses a slice without one). HEAVY_REAL_TESTS=1 (its `fork-ci: run` line):
      # no manager fails the step instead of skipping it; so does a slice without the limit (the show line).
      # The set-up is a step of its own (the test step is only its command), so the test step
      # sets XDG_RUNTIME_DIR itself.
      - name: Start a systemd user manager with a heavy slice
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          mkdir -p ~/.config/systemd/user
          printf '[Slice]\nMemoryMax=2G\n' > ~/.config/systemd/user/heavy.slice
          systemctl --user daemon-reload
          systemctl --user show heavy.slice -p LoadState,FragmentPath,MemoryMax
      - name: heavy kit with a real systemd user manager
        env:
          FORK_CI_TEST_RECORDS: ${{ runner.temp }}/fork-test-records
        run: XDG_RUNTIME_DIR="/run/user/$(id -u)" node .github/scripts/fork-ci-tests.cjs --run fork-kit/heavy/tests/heavy.test.py
      # What each fork test of this job ran (fork-ci-tests.cjs's records), for fork-ci-result, keyed by job, leg and
      # attempt so no other job's, leg's or attempt's records can stand in; none fails the job (fork-contracts.test.py).
      - name: Upload the fork test records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-test-records-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-test-records/
          if-no-files-found: error
          retention-days: 7

  # Every commit a pull request or a push to main adds, history included: a
  # secret committed and then deleted is still public. Release runs test a
  # commit that already passed this on its way to main, so they skip it.
  # The job, the ranges and why: fork-secret-scan.yml, which a pull request
  # also runs on its own, so a newer push cancelling this run cannot leave a
  # head unscanned.
  secrets:
    name: Secret scan
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.ref == '') }}
    uses: ./.github/workflows/fork-secret-scan.yml
    with:
      test: true

  lint:
    name: Lint
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['lint'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['lint'][0], fromJSON(needs.changes.outputs.runners || '{}')['lint'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Memory pressure from here on, for the one automatic re-run of an infrastructure failure
      # (fork-ci-rerun.yml reads the note the end step leaves; fork-ci-pressure.py never fails the job,
      # and one that hangs on a stalled machine is stopped after the `changes` job's probe_seconds with a warning:
      # the tests still run).
      - name: Note memory pressure at the start
        timeout-minutes: 1
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py start || echo "::warning::fork-ci-pressure: start stopped (exit $?), no numbers; the job goes on"'

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # Here, not in `workflows`: it greps app code, so it needs the whole tree (#254). Lint runs on every
      # pull request, fork-only ones too. Listed in .github/fork-ci-tests.txt as run by this file.
      - name: Check that app code reads no fork-owned path
        env:
          FORK_CI_TEST_RECORDS: ${{ runner.temp }}/fork-test-records
        run: node .github/scripts/fork-ci-tests.cjs --run .github/scripts/fork-owned-reads.test.py
      # What each fork test of this job ran (fork-ci-tests.cjs's records), for fork-ci-result, keyed by job, leg and
      # attempt so no other job's, leg's or attempt's records can stand in; none fails the job (fork-contracts.test.py).
      - name: Upload the fork test records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-test-records-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-test-records/
          if-no-files-found: error
          retention-days: 7

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check unused code
        run: vp run knip:check

      - name: Check generated GitHub GraphQL operations
        run: vp run --filter @t3tools/source-control-github generate --check

      - name: Check generated Expo GraphQL operations
        run: vp run --filter t3 generate --check

      - name: Check generated Linear GraphQL operations
        run: vp run --filter @t3tools/issue-tracker-linear generate --check

      - name: Check i18n catalogs
        run: vp run i18n:check

      - name: Check
        run: vp check

      # Last: the numbers since the start step in the log, and as a notice when the job did not succeed.
      - name: Note memory pressure at the end
        timeout-minutes: 1
        if: ${{ always() && hashFiles('.github/scripts/fork-ci-pressure.py') != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py end || echo "::warning::fork-ci-pressure: end stopped (exit $?), no numbers"'

  build:
    name: Build and Typecheck
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && (needs.changes.outputs.build != 'false' || needs.changes.outputs.typecheck != 'false')) }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['build'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['build'][0], fromJSON(needs.changes.outputs.runners || '{}')['build'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Memory pressure from here on, for the one automatic re-run of an infrastructure failure
      # (fork-ci-rerun.yml reads the note the end step leaves; fork-ci-pressure.py never fails the job,
      # and one that hangs on a stalled machine is stopped after the `changes` job's probe_seconds with a warning:
      # the tests still run).
      - name: Note memory pressure at the start
        timeout-minutes: 1
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py start || echo "::warning::fork-ci-pressure: start stopped (exit $?), no numbers; the job goes on"'

      # Runs in the background while Vite+ installs; the step before the build waits for it.
      # Xvfb is for the desktop launch check below.
      - name: Start installing browser secret helper build libraries
        if: needs.changes.outputs.build != 'false'
        run: |
          # A fleet runner has no sudo: its host must have the packages already.
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            if pkg-config --exists libsecret-1 && command -v xvfb-run >/dev/null; then
              echo 0 > "$RUNNER_TEMP/apt-status"
            else
              echo "This fleet runner's host lacks some of: libsecret-1-dev pkg-config xvfb (.github/fork-fleet.md)" > "$RUNNER_TEMP/apt.log"
              echo 1 > "$RUNNER_TEMP/apt-status"
            fi
          else
            (
              set +e
              sudo apt-get update -o Acquire::Languages=none \
                -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
                -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
                sudo apt-get install -y libsecret-1-dev pkg-config xvfb
              echo "$?" > "$RUNNER_TEMP/apt-status"
            ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &
          fi

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        id: electron
        run: vp run --filter @t3tools/desktop ensure:electron

      # Upstream reads a private remote task cache (a secret the fork has not
      # got). Here vp's local task cache is kept between runs instead: vp
      # fingerprints each task's inputs, so a restored entry only replays a
      # task whose inputs are unchanged. A new lockfile starts a fresh cache.
      - name: Cache vp tasks
        if: needs.changes.outputs.typecheck != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-v1-typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-${{ github.sha }}
          restore-keys: vp-tasks-v1-typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-

      # Runs in the background while the build runs, and reports in the last
      # step: neither result hides the other.
      - name: Start typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && needs.changes.outputs.typecheck != 'false' }}
        run: |
          (
            set +e
            vpr typecheck
            echo "$?" > "$RUNNER_TEMP/typecheck-status"
          ) > "$RUNNER_TEMP/typecheck.log" 2>&1 < /dev/null &

      - name: Finish installing browser secret helper build libraries
        id: apt
        if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      - name: Build desktop pipeline
        id: build
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && steps.apt.outcome == 'success' && needs.changes.outputs.build != 'false' }}
        run: vp run build:desktop

      - name: Verify preload bundle output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      # Release-only otherwise; build-exe rejects imports a single-executable cannot resolve.
      - name: Build CLI single-executable
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node apps/server/scripts/cli.ts build-exe
          apps/server/dist-exe/t3 --version

      - name: Open the seeded thread in the built desktop app
        id: desktop_launch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.desktop_launch != 'false' }}
        timeout-minutes: 4
        run: |
          electron=$(node -p "require('./apps/desktop/node_modules/electron')")
          xvfb-run -a node scripts/smoke-desktop-app.ts --executable "$electron" --app apps/desktop \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"

      - name: Upload desktop launch check
        if: ${{ failure() && steps.desktop_launch.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      - name: Resolve Playwright version
        id: playwright_version
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for the built web client boot check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' && steps.chromium_cache.outputs.cache-hit != 'true' }}
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Boot the built web client
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.test_web != 'false' }}
        timeout-minutes: 3
        run: node apps/web/scripts/verify-built-boot.ts

      - name: Typecheck
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          until test -s "$RUNNER_TEMP/typecheck-status"; do sleep 1; done
          cat "$RUNNER_TEMP/typecheck.log"
          exit "$(cat "$RUNNER_TEMP/typecheck-status")"

      # Last: the numbers since the start step in the log, and as a notice when the job did not succeed.
      - name: Note memory pressure at the end
        timeout-minutes: 1
        if: ${{ always() && hashFiles('.github/scripts/fork-ci-pressure.py') != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py end || echo "::warning::fork-ci-pressure: end stopped (exit $?), no numbers"'

  # Everything except `t3` (apps/server) and the web app, which have their own jobs.
  # Upstream runs this on one large runner; one 4-CPU runner took 6 minutes.
  # Two runners split it (.github/scripts/fork-test-shards.cjs): each runs a
  # vitest slice of every large package and half of the others, whole.
  test:
    name: Test ${{ matrix.shard }}
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.test != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')[format('test-{0}', matrix.shard)][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')[format('test-{0}', matrix.shard)][0], fromJSON(needs.changes.outputs.runners || '{}')[format('test-{0}', matrix.shard)][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Memory pressure from here on, for the one automatic re-run of an infrastructure failure
      # (fork-ci-rerun.yml reads the note the end step leaves; fork-ci-pressure.py never fails the job,
      # and one that hangs on a stalled machine is stopped after the `changes` job's probe_seconds with a warning:
      # the tests still run).
      - name: Note memory pressure at the start
        timeout-minutes: 1
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py start || echo "::warning::fork-ci-pressure: start stopped (exit $?), no numbers; the job goes on"'

      # A shard with nothing to run says so in the summary and stops here.
      - name: Pick this shard's packages
        id: shard
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: |
          work=$(node .github/scripts/fork-test-shards.cjs "${{ matrix.shard }}/${{ strategy.job-total }}")
          whole=$(awk '$1 == "whole" { printf "%s ", $2 }' <<< "$work")
          split=$(awk '$1 == "split" { printf "%s ", $2 }' <<< "$work")
          { echo "whole=${whole% }"; echo "split=${split% }"; echo "any=$([[ -n "$work" ]] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

      # The desktop tests compile the browser secret helper. The install runs in
      # the background while Vite+ installs; the step before the tests waits for it.
      - name: Start installing browser secret helper build libraries
        if: steps.shard.outputs.any == 'true'
        run: |
          # A fleet runner has no sudo: its host must have the packages already.
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            if pkg-config --exists libsecret-1; then
              echo 0 > "$RUNNER_TEMP/apt-status"
            else
              echo "This fleet runner's host lacks some of: libsecret-1-dev pkg-config (.github/fork-fleet.md)" > "$RUNNER_TEMP/apt.log"
              echo 1 > "$RUNNER_TEMP/apt-status"
            fi
          else
            (
              set +e
              sudo apt-get update -o Acquire::Languages=none \
                -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
                -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
                sudo apt-get install -y libsecret-1-dev pkg-config
              echo "$?" > "$RUNNER_TEMP/apt-status"
            ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &
          fi

      - name: Setup Vite+
        if: steps.shard.outputs.any == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Cache Electron download
        if: steps.shard.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        if: steps.shard.outputs.any == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test preview artifact validation
        if: matrix.shard == 1
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      # workflow-credentials (below) reads mobile-eas-preview-fork.yml, a workflow the fork deletes
      # (fork-removed-workflows.txt): upstream's copy, .github/fork-upstream-mobile-eas-preview-fork.yml
      # (from the follow's base tag), goes back for the test only, and out again after it. A follow
      # that changes upstream's file refreshes the copy:
      # git show <tag>:.github/workflows/mobile-eas-preview-fork.yml > .github/fork-upstream-mobile-eas-preview-fork.yml
      - name: Put back upstream's mobile-eas-preview-fork.yml for the release checks
        if: matrix.shard == 1
        run: cp .github/fork-upstream-mobile-eas-preview-fork.yml .github/workflows/mobile-eas-preview-fork.yml

      # Upstream's ci.yml runs the first six; the fork adds thread-transfer-report, which upstream
      # runs from a workflow_run of its CI (disabled in the fork).
      - name: Test release checks
        if: matrix.shard == 1
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs .github/scripts/mobile-preview-comment.test.cjs .github/scripts/mobile-ios-preview-record.test.cjs .github/scripts/test-delta.test.cjs .github/scripts/workflow-credentials.test.cjs .github/scripts/thread-transfer-report.test.cjs

      - name: Take upstream's mobile-eas-preview-fork.yml out again
        if: ${{ always() && matrix.shard == 1 }}
        run: rm -f .github/workflows/mobile-eas-preview-fork.yml

      - name: Finish installing browser secret helper build libraries
        if: steps.shard.outputs.any == 'true'
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      # Fork only, as upstream's Test Server: Vitest's module cache (transformed files, keyed
      # inside by each file's content, the config and Vitest's version), saved only by pushes
      # to main so pull requests never evict each other's entries. Tests always run.
      - name: Restore Vitest module cache
        if: steps.shard.outputs.any == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-modules-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Whole packages as upstream runs them; a large package's slice runs its
      # own test script in its directory with vitest's --shard (`vp run` does
      # not pass arguments through to vitest).
      - name: Test
        if: steps.shard.outputs.any == 'true'
        env:
          WHOLE: ${{ steps.shard.outputs.whole }}
          SPLIT: ${{ steps.shard.outputs.split }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          set -o pipefail
          # The runner's trace writer can crash on surrogate pairs in test output.
          ascii() {
            python3 -u -c '
          import sys
          for line in sys.stdin:
              sys.stdout.write(line.encode("ascii", "backslashreplace").decode("ascii"))
          '
          }
          status=0
          if [[ -n "$WHOLE" ]]; then
            filters=()
            for package in $WHOLE; do filters+=(--filter "$package"); done
            vp run --parallel --concurrency-limit 4 "${filters[@]}" test 2>&1 | ascii || status=1
          fi
          for dir in $SPLIT; do
            echo "::group::$dir slice $SHARD"
            script=$(jq -r .scripts.test "$dir/package.json")
            (cd "$dir" && eval "$script --shard=$SHARD") 2>&1 | ascii || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Save Vitest module cache
        if: steps.shard.outputs.any == 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      # Last: the numbers since the start step in the log, and as a notice when the job did not succeed.
      - name: Note memory pressure at the end
        timeout-minutes: 1
        if: ${{ always() && hashFiles('.github/scripts/fork-ci-pressure.py') != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py end || echo "::warning::fork-ci-pressure: end stopped (exit $?), no numbers"'

  # Upstream runs this on one large runner; on a 4-CPU runner the 548 files
  # took 7.5 minutes, so each of the shards below takes a vitest slice.
  test_web:
    name: Test Web ${{ matrix.shard }}
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.test_web != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')[format('test_web-{0}', matrix.shard)][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')[format('test_web-{0}', matrix.shard)][0], fromJSON(needs.changes.outputs.runners || '{}')[format('test_web-{0}', matrix.shard)][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Three shards, not upstream's two: with a garbage collection after every file (below) one
        # shard of two took up to 7 minutes; three keep each near the time of two without it.
        # .github/fork-fleet.json's test_web shards must match.
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Memory pressure from here on, for the one automatic re-run of an infrastructure failure
      # (fork-ci-rerun.yml reads the note the end step leaves; fork-ci-pressure.py never fails the job,
      # and one that hangs on a stalled machine is stopped after the `changes` job's probe_seconds with a warning:
      # the tests still run).
      - name: Note memory pressure at the start
        timeout-minutes: 1
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py start || echo "::warning::fork-ci-pressure: start stopped (exit $?), no numbers; the job goes on"'

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      # The Test step's VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB is not a documented vitest option: fail
      # here, not with browser crashes later, when the installed vitest no longer reads it.
      - name: Check vitest still reads the garbage collection setting
        working-directory: apps/web
        run: node ../../.github/scripts/fork-vitest-gc-check.cjs

      # Fork only: Vitest's module cache, as on the Test shards.
      - name: Restore Vitest module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-web-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-modules-web-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Upstream: `vp run --filter @t3tools/web test --shard N/total`. The same
      # script, run in its directory with the slice, as on the Test shards.
      # Upstream's release test_web also boots the built client on shard 1;
      # here the Build job does that, for CI and release runs alike.
      # Chromium's test pages kept 1.0-1.6 GB each of garbage it did not collect by itself, and late in
      # a shard the browser connection then closed ("Browser connection was closed", fork issue #245).
      # Vitest collects it after every file only when free space under the temp folder is below this
      # many GB (its default is 4), so a number no disk reaches makes it collect after every file.
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: "1000000"
        working-directory: apps/web
        run: eval "$(jq -r .scripts.test package.json) --shard=$SHARD"

      - name: Save Vitest module cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-web-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      # Last: the numbers since the start step in the log, and as a notice when the job did not succeed.
      - name: Note memory pressure at the end
        timeout-minutes: 1
        if: ${{ always() && hashFiles('.github/scripts/fork-ci-pressure.py') != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py end || echo "::warning::fork-ci-pressure: end stopped (exit $?), no numbers"'

  # apps/server runs its test files one at a time; shards spread them over
  # separate runners. As upstream, the shards run the change detector
  # themselves, so the steps follow ci.yml one for one; a shard the change
  # cannot affect says so in its summary. They wait for `changes` only for a
  # release run's resolved commit (seconds; every other job waits for it too).
  # Fork only: a fork-only pull request skips all of them (`changes`, step fork_only).
  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.test_server != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')[format('test_server-{0}', matrix.shard)][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')[format('test_server-{0}', matrix.shard)][0], fromJSON(needs.changes.outputs.runners || '{}')[format('test_server-{0}', matrix.shard)][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Memory pressure from here on, for the one automatic re-run of an infrastructure failure
      # (fork-ci-rerun.yml reads the note the end step leaves; fork-ci-pressure.py never fails the job,
      # and one that hangs on a stalled machine is stopped after the `changes` job's probe_seconds with a warning:
      # the tests still run).
      - name: Note memory pressure at the start
        timeout-minutes: 1
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py start || echo "::warning::fork-ci-pressure: start stopped (exit $?), no numbers; the job goes on"'

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      # Upstream reads a private remote task cache (a secret the fork has not
      # got). Here vp's local task cache is kept between runs instead: vp
      # fingerprints each task's inputs, so a restored entry only replays a
      # task whose inputs are unchanged. A new lockfile starts a fresh cache.
      - name: Cache vp tasks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-v1-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-${{ github.sha }}
          restore-keys: vp-tasks-v1-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}-

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for server browser integration tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      # As upstream: Vitest's module cache, saved only by pushes to main so
      # pull requests never evict each other's entries.
      - name: Restore Vitest module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          T3CODE_TRANSFER_BUDGET_SCENARIOS_PATH: ${{ runner.temp }}/thread-transfer-scenarios.json
        # As upstream: one process per file spends ~2s starting before its tests run; one file per
        # vCPU overlaps that.
        run: >-
          vp run test:cached -- --shard ${{ matrix.shard }}/${{ strategy.job-total }} --concurrency 4
          --uncached apps/server/integration/transferBudgetV2.integration.test.ts
          --verify-hits 1 apps/server

      - name: Save Vitest module cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      # integration/transferBudgetV2.integration.test.ts writes the report; exactly one shard
      # produces these files.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: thread-transfer-results
          path: |
            ${{ runner.temp }}/thread-transfer-result.json
            ${{ runner.temp }}/thread-transfer-scenarios.json
          if-no-files-found: ignore
          retention-days: 30

      # Last: the numbers since the start step in the log, and as a notice when the job did not succeed.
      - name: Note memory pressure at the end
        timeout-minutes: 1
        if: ${{ always() && hashFiles('.github/scripts/fork-ci-pressure.py') != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py end || echo "::warning::fork-ci-pressure: end stopped (exit $?), no numbers"'

  rust:
    name: Rust
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.rust != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['rust'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['rust'][0], fromJSON(needs.changes.outputs.runners || '{}')['rust'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Memory pressure from here on, for the one automatic re-run of an infrastructure failure
      # (fork-ci-rerun.yml reads the note the end step leaves; fork-ci-pressure.py never fails the job,
      # and one that hangs on a stalled machine is stopped after the `changes` job's probe_seconds with a warning:
      # the tests still run).
      - name: Note memory pressure at the start
        timeout-minutes: 1
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py start || echo "::warning::fork-ci-pressure: start stopped (exit $?), no numbers; the job goes on"'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      # Fork only: cargo's downloaded crates and the crates' build output, read only for the same
      # rustc and lockfiles and saved once for them, by a push to main. Cargo still rebuilds the
      # crates themselves (the fresh checkout's sources are newer than every cached build) and
      # runs every test.
      - name: Resolve rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/resource-monitor/target
            native/kde-snap-shot/target
            native/hyprland-snap-shot/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-rustc${{ steps.rustc.outputs.version }}-${{ hashFiles('native/*/Cargo.lock') }}

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

      - name: Save Cargo cache
        if: github.event_name == 'push' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/resource-monitor/target
            native/kde-snap-shot/target
            native/hyprland-snap-shot/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      # Last: the numbers since the start step in the log, and as a notice when the job did not succeed.
      - name: Note memory pressure at the end
        timeout-minutes: 1
        if: ${{ always() && hashFiles('.github/scripts/fork-ci-pressure.py') != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py end || echo "::warning::fork-ci-pressure: end stopped (exit $?), no numbers"'

  # Upstream runs this on macOS 26. GitHub-hosted macOS minutes are free on a
  # public repository; it runs only for native mobile sources or a workflow change.
  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.mobile_native != 'false') }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    needs: changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && needs.changes.outputs.release_smoke != 'false') }}
    # Fleet or GitHub-hosted: the `route` step of `changes` (.github/fork-fleet.md).
    runs-on: ${{ vars.CI_RUNNERS != 'github' && (needs.changes.outputs.fleet_attempt == github.run_attempt || (needs.changes.outputs.fleet_mode == 'fleet' && vars.CI_RUNNERS == 'fleet')) && fromJSON(needs.changes.outputs.runners || '{}')['release_smoke'][1] && fromJSON(format('["{0}","{1}-a{2}"]', fromJSON(needs.changes.outputs.runners || '{}')['release_smoke'][0], fromJSON(needs.changes.outputs.runners || '{}')['release_smoke'][1], github.run_attempt)) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.changes.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Memory pressure from here on, for the one automatic re-run of an infrastructure failure
      # (fork-ci-rerun.yml reads the note the end step leaves; fork-ci-pressure.py never fails the job,
      # and one that hangs on a stalled machine is stopped after the `changes` job's probe_seconds with a warning:
      # the tests still run).
      - name: Note memory pressure at the start
        timeout-minutes: 1
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py start || echo "::warning::fork-ci-pressure: start stopped (exit $?), no numbers; the job goes on"'

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          # Lint saves the pnpm store; the others only restore it.
          save-pnpm-store: false

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

      # Last: the numbers since the start step in the log, and as a notice when the job did not succeed.
      - name: Note memory pressure at the end
        timeout-minutes: 1
        if: ${{ always() && hashFiles('.github/scripts/fork-ci-pressure.py') != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'timeout -k 5 "${{ needs.changes.outputs.probe_seconds }}" python3 -I .github/scripts/fork-ci-pressure.py end || echo "::warning::fork-ci-pressure: end stopped (exit $?), no numbers"'

  # The one check a ruleset requires. Fails when any job fails or is cancelled,
  # or is skipped without a reason: `changes` said its gates were not needed,
  # or (secret scan) it is a release run. The summary lists every job, the
  # reason for every skip, and each job's wall time.
  # `always()` rather than `!cancelled()`: a skipped job reports success to
  # branch protection, so a cancelled run must still produce a failing result.
  fork_ci_result:
    name: fork-ci-result
    # Runs on every pull request, outside ones too (it checks nothing out), so that it fails there.
    if: ${{ always() }}
    needs:
      [
        outside_pr,
        changes,
        fleet_watch,
        fork_checks_ran,
        workflows,
        action_tests,
        kit_tests,
        kit_root_tests,
        secrets,
        lint,
        build,
        test,
        test_web,
        test_server,
        rust,
        mobile_native_static_analysis,
        release_smoke,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The job list API needs actions: read; nothing here checks out code.
    permissions:
      actions: read
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_RUN: ${{ inputs.ref != '' }}
          OUTSIDE_PR: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A jq program: $release is jq's variable, not the shell's.
          # shellcheck disable=SC2016
          why='{
            build: "the change affects neither desktop, server nor web, and no package needs a typecheck",
            test: "the change affects no package this job tests",
            test_web: "the change affects nothing @t3tools/web depends on",
            test_server: "the change affects nothing t3 (apps/server) depends on",
            rust: "the change touches none of the native Rust crates",
            mobile_native_static_analysis: (if $release == "true"
              then "release run: upstream release.yml has no macOS lint"
              else "no native mobile source, Brewfile or CI workflow changed" end),
            release_smoke: "the change does not affect scripts/",
            secrets: "release run: the commit was scanned on its way to main",
            outside_pr: "not a pull request from another fork",
            fleet_watch: "no job of this run went to the fleet",
            fork_checks_ran: "outside pull request: refused above"
          }'
          {
            echo "### fork-ci-result"
            echo
            echo "| Job | Result | Why skipped |"
            echo "| --- | --- | --- |"
            echo "$RESULTS" | jq -r --arg release "$RELEASE_RUN" "$why as \$why
              | to_entries[]
              | \"| \(.key) | \(.value.result) | \(if .value.result == \"skipped\" then (\$why[.key] // \"no reason: fails\") else \"\" end) |\""
            if [[ "$(echo "$RESULTS" | jq -r '.changes.outputs.fork_only')" == true ]]; then
              echo
              echo "Fork-only pull request: every changed path is fork-owned (.github/fork-owned-paths.txt), so the app jobs were skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # An outside pull request fails here whatever the other jobs did.
          if [[ "$OUTSIDE_PR" == true ]]; then
            echo "::error::outside PR: not tested here; a maintainer must review"
            exit 1
          fi
          # A job may skip only when `changes` said every gate it represents was
          # not needed (gates are keyed by job name, except merged Build and the
          # macOS lint), or, for the secret scan, in a release run. outside_pr
          # passes by being skipped (outside pull requests stopped above).
          echo "$RESULTS" | jq -e --arg release "$RELEASE_RUN" '.changes.outputs as $gates
            | {build: ["build", "typecheck", "desktop_launch"], mobile_native_static_analysis: ["mobile_native"]} as $renamed
            | all(to_entries[];
                if .key == "outside_pr" then .value.result == "skipped"
                else .value.result == "success"
                  or (.value.result == "skipped"
                    and (if .key == "secrets" then $release == "true"
                         else (($renamed[.key] // [.key]) | all(.[]; $gates[.] == "false")) end)) end)' > /dev/null

      # What every listed fork test ran (#664): each job that runs them uploads its runner's records
      # (fork-ci-tests.cjs, RECORDS there), named by job, leg and attempt. A job of this run that passed
      # uploaded them in the attempt it passed in (its upload step fails on none), so the newest attempt of
      # each job and leg is the one that counts; an older one, another run's or another commit's never does.
      # Red: a job or leg with no records, a listed test with no record (or two), one that failed, showed no
      # test count, ran none, or skipped other tests than exactly those its `fork-ci: may skip <test>` lines
      # name (each skip by name; an own run: none).
      - name: Download the fork test records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fork-test-records-*
          path: ${{ runner.temp }}/fork-test-records
      - name: Require a record of every listed fork test
        env:
          RECORDS: ${{ runner.temp }}/fork-test-records
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # The commit every job's checkout tests: a release run's resolved one, else the run's own.
          SHA: ${{ needs.changes.outputs.sha || github.sha }}
          # Each job that runs listed fork tests, with its number of legs (fork-contracts.test.py keeps it so).
          RECORD_JOBS: '{"workflows": 1, "action_tests": 1, "kit_tests": 3, "kit_root_tests": 1, "lint": 1}'
        run: |
          python3 -I - <<'CHECK'
          import json, os, re

          here = os.environ['RECORDS']
          run_id = os.environ['RUN_ID']
          attempt = int(os.environ['RUN_ATTEMPT'])
          sha = os.environ['SHA']
          legs = json.loads(os.environ['RECORD_JOBS'])
          problems = []
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              problems.append(f'the commit to compare the records with is {sha!r}, not a full SHA')

          # The newest attempt's artifact of each job and leg.
          newest = {}
          for name in sorted(os.listdir(here)) if os.path.isdir(here) else []:
              m = re.fullmatch(r'fork-test-records-([a-z0-9_]+)-([0-9]+)-([0-9]+)', name)
              if not m or m[1] not in legs or int(m[2]) >= legs[m[1]] or not 1 <= int(m[3]) <= attempt:
                  problems.append(f'{name}: no records artifact of a job, leg and attempt of this run')
                  continue
              leg, at = (m[1], int(m[2])), int(m[3])
              if leg not in newest or at > newest[leg][0]:
                  newest[leg] = (at, name)
          for job, count in sorted(legs.items()):
              for index in range(count):
                  if (job, index) not in newest:
                      problems.append(f'{job} (leg {index + 1} of {count}): uploaded no fork test records')

          def names(value):
              ok = isinstance(value, list) and all(type(n) is str for n in value) and len(set(value)) == len(value)
              return value if ok else None

          def judge(row, where):
              key = row['key']
              tests, skipped, failed = row.get('tests'), row.get('skipped'), row.get('failed')
              # Each skipped test by name, and the ones the test declares it may skip (an own run: none).
              skipped_tests = names(row.get('skipped_tests'))
              allowed = [] if row.get('own') is not False else names(row.get('allowed'))
              if row.get('status') != 0:
                  limit = row.get('timed_out')
                  if type(limit) in (int, float) and limit > 0:
                      return [f'{key} timed out after {limit:g} s ({where})']
                  return [f'{key} failed (exit {row.get("status")}) ({where})']
              if not all(type(n) is int and n >= 0 for n in (tests, skipped, failed)):
                  return [f'{key}: no test count, so no test is known to have run ({where})']
              out = []
              if tests - skipped <= 0:
                  out.append(f'{key} ran no test ({tests} found, {skipped} skipped) ({where})')
              if skipped_tests is None or allowed is None or len(skipped_tests) != skipped:
                  out.append(f'{key} skipped {skipped} tests, not each once by name ({where})')
              elif set(skipped_tests) != set(allowed):
                  out.append(f'{key} skipped {sorted(skipped_tests)}, but may and must skip {sorted(allowed)} ({where})')
              if failed:
                  out.append(f'{key}: {failed} failed ({where})')
              return out

          wanted = None
          recorded = {}
          ran = skips = 0
          for (job, index), (at, name) in sorted(newest.items()):
              folder = os.path.join(here, name)
              files = sorted(os.listdir(folder))
              if not files:
                  problems.append(f'{name}: empty')
              for file in files:
                  where = f'{name}/{file}'
                  try:
                      with open(os.path.join(folder, file), encoding='utf-8') as f:
                          body = json.load(f)
                  except (OSError, ValueError) as e:
                      problems.append(f'{where}: unreadable ({e})')
                      continue
                  if not isinstance(body, dict) or body.get('v') != 1:
                      problems.append(f'{where}: not a version 1 record')
                      continue
                  if (body.get('run_id'), body.get('run_attempt'), body.get('job')) != (run_id, at, job):
                      problems.append(f'{where}: written by another run, attempt or job')
                      continue
                  if body.get('sha') != sha:
                      problems.append(f'{where}: tests {body.get("sha")}, not {sha}')
                      continue
                  call = body.get('call') if isinstance(body.get('call'), dict) else {}
                  if 'parts' in call:
                      if call.get('shard') != f'{index + 1}/{legs[job]}':
                          problems.append(f'{where}: shard {call.get("shard")}, not leg {index + 1}/{legs[job]}')
                      if not isinstance(body.get('all'), list):
                          problems.append(f'{where}: no list of the tests to run')
                      elif wanted is None:
                          wanted = (body['all'], where)
                      elif body['all'] != wanted[0]:
                          problems.append(f'{where}: its tests to run differ from {wanted[1]}')
                  elif not isinstance(call.get('run'), str):
                      problems.append(f'{where}: neither a part nor an own run')
                  rows, owed = body.get('results'), body.get('owed')
                  if not isinstance(rows, list) or not isinstance(owed, list):
                      problems.append(f'{where}: no results')
                      continue
                  rows = [r for r in rows if isinstance(r, dict) and isinstance(r.get('key'), str)]
                  if sorted(r['key'] for r in rows) != sorted(owed):
                      missing = sorted(set(owed) - {r['key'] for r in rows})
                      problems.append(f'{where}: results do not match what it owed (missing: {missing})')
                  for row in rows:
                      if row['key'] in recorded:
                          problems.append(f'{row["key"]}: recorded twice ({recorded[row["key"]]}, {where})')
                          continue
                      recorded[row['key']] = where
                      problems += judge(row, where)
                      if type(row.get('tests')) is int and type(row.get('skipped')) is int:
                          ran += row['tests'] - row['skipped']
                          skips += row['skipped']

          if wanted is None:
              problems.append('no part records: the tests to run are unknown')
          else:
              for key in sorted(set(wanted[0]) - set(recorded)):
                  problems.append(f'{key}: listed, but no job recorded it: it did not run')
              for key in sorted(set(recorded) - set(wanted[0])):
                  problems.append(f'{key}: recorded, but not among the tests to run')

          for problem in problems:
              print(f'::error::{problem}')
          line = f'Fork test records: {len(recorded)} runs of listed tests, {ran} tests ran, {skips} skipped.'
          print(line)
          with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a', encoding='utf-8') as f:
              f.write(f'\n{line}' + (f' {len(problems)} problems (the log names them).' if problems else '') + '\n')
          raise SystemExit(1 if problems else 0)
          CHECK

      # A run whose server tests ran must have produced the transfer measurements.
      - name: Require transfer measurements
        if: needs.test_server.result == 'success' && needs.changes.outputs.test_server != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer

      # Information only: read from the run's job list, never fails the run.
      - name: Job wall times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100") || {
            echo "::warning::Job timings unavailable: the job list API call failed."
            echo "Job timings unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          echo "Job timings for $(echo "$jobs" | jq '.jobs | length') jobs."
          {
            echo
            echo "#### Job wall times"
            echo
            echo "| Job | Queued | Ran |"
            echo "| --- | ---: | ---: |"
            echo "$jobs" | jq -r '.jobs[]
              | select(.completed_at != null and .started_at != null)
              | ((.started_at | fromdateiso8601) - (.created_at | fromdateiso8601)) as $queued
              | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) as $ran
              | "| \(.name) | \($queued)s | \($ran / 60 | floor)m \($ran % 60)s |"'
          } >> "$GITHUB_STEP_SUMMARY"
