name: Fork fleet sweep

# Fork only. In auto and github mode (repository variable CI_RUNNERS; unset is
# auto), a trusted Fork tests run that the fleet did not finish runs again,
# GitHub-hosted:
# - a fleet job queued 10 minutes (stuck_seconds) without a runner: the run is
#   cancelled (if fork-tests.yml's fleet_watch has not done it already) and
#   re-run;
# - a run that ended red because a fleet runner stopped during a job (no failed
#   step of the job's own): re-run. A run a person cancelled stays cancelled.
# Only trusted runs are touched, by the same rule as the dispatcher's (GitHub's
# record of the run, each pull request read from the API), never a stranger's.
# The sweep's re-run is triggered by github-actions, which is not a trusted
# actor: it is GitHub-hosted, and the sweep never touches it, so each run is
# re-run once at most. Nothing is kept between sweeps: each reads the runs of
# the last 24 hours (the latest attempt of each) from GitHub, so a sweep that
# stopped half-way is finished by the next. Fleet mode re-runs nothing: it only
# cancels, with an error, a trusted run whose fleet job waited 2 hours
# (fleet_stuck_seconds; a re-run of failed jobs has no fleet_watch of its own).
# .github/scripts/fork-fleet.py sweep; runbook .github/fork-fleet.md.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-fleet-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /.github/fork-fleet.json
            /.github/scripts/fork-fleet.py
          sparse-checkout-cone-mode: false

      - name: Cancel and re-run what the fleet did not finish
        env:
          FLEET_MODE: ${{ vars.CI_RUNNERS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/fork-fleet.py sweep
