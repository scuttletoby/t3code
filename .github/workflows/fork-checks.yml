name: Fork checks

# Rules for this fork's own changes, run on every pull request. Upstream's CI needs runners a fork
# does not have; fork-tests.yml runs upstream's tests on hosted runners instead.
#
# pull_request_target, not pull_request: GitHub then runs this workflow file and the check script
# from the default branch, so a pull request cannot weaken, skip or delete the check that judges
# it. The pull request's commits are only fetched as git objects and read as text; nothing from
# them is checked out or run, so the base branch's permissions never reach pull request code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Every job but `outside_pr` starts with the same condition: on a pull request, only one whose branch
# is in this repository. A pull request from another fork runs none of them, not even after approval
# (the repository asks approval only for pull_request runs, and pull_request_target skips that, but
# this file always comes from the default branch). It gets only `outside_pr`, which checks nothing
# out, runs nothing from the pull request, gets no token and fails. A job skipped by its if: counts
# as passed, so a ruleset that requires "No database schema changes" must also require "Outside pull
# request". A head repository GitHub no longer knows reads as "another fork". Test:
# fork-contracts.test.py.
jobs:
  # It also refuses changes to the upstream files listed in its last step. Keep the name: it is what
  # a ruleset would require.
  no_schema_changes:
    name: No database schema changes
    if: ${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Plain git, not actions/checkout: upstream's tree has gitlinks under .repos/ but no
      # .gitmodules, and checkout's credential cleanup runs `git submodule foreach`, which fails on
      # them. The full checkout fetches the default branch's blobs in one batch; a sparse one leaves
      # the check to fetch every blob it reads one at a time.
      - name: Check out the default branch and fetch the pull request's commits (not checked out)
        env:
          DEFAULT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --no-recurse-submodules --filter=blob:none origin \
            "$DEFAULT_SHA" "$BASE_SHA" "$HEAD_SHA"
          git checkout -q --detach "$DEFAULT_SHA"

      - name: Test the check
        run: node --test .github/scripts/fork-schema-check.test.cjs .github/scripts/fork-upstream-files-check.test.cjs

      # T3 has no down-migrations, so a fork migration strands installs that return to upstream.
      - name: Refuse schema and migration changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/fork-schema-check.cjs "$BASE_SHA" "$HEAD_SHA"

      # The fork's add-ons live in their own files and layers, so these upstream files stay exactly
      # upstream's (upstream's own changes reach main through fork-follow's rebase, not a PR). Runs
      # even when the schema step refused, so a PR sees both reasons.
      - name: Refuse changes to upstream files the fork leaves alone
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The list, separated by spaces. To guard one more file, add its path here.
          UPSTREAM_FILES: apps/server/src/orchestration-v2/Orchestrator.ts apps/server/src/provider/agentContextBudget.json
        run: node .github/scripts/fork-upstream-files-check.cjs "$BASE_SHA" "$HEAD_SHA" "$UPSTREAM_FILES"

  outside_pr:
    name: Outside pull request
    if: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse an outside pull request
        run: |
          echo "::error::outside PR: not tested here; a maintainer must review"
          exit 1
