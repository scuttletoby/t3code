name: Fork secret sweep

# Daily, and by hand: the secret scan's sweep of every ref of this repository but pull request heads
# (fork-secret-scan.yml, run as the schedule or workflow_dispatch event: see "sweep" in
# .github/scripts/fork-secret-scan.sh), for what no push run read (a push with [skip ci], more
# than 3 tags in one push, a push with a workflow's GITHUB_TOKEN, a notes ref, branches older than
# the scan). About 1 to 3 minutes of a GitHub-hosted runner a day (free for a public repository).
# GitHub turns a schedule off after 60 days without activity in the repository.
#
# A failed schedule run alerts no one (GitHub mails only the user who last edited the cron line),
# and a finding stays red every day until its key is rotated and allowed. So `alert` opens one
# issue, "Secret sweep failed" (a comment on it for each later failed run), and closes it on the
# next good run (.github/scripts/fork-run-alert.sh). Only that job may write issues; the sweep
# itself reads. A manual run on another branch gets no issue: its red run is the report.
# Each run keeps its record of the deleted tips a scan read (#691) as an artifact, and the next
# run on the same branch reads it (fork-secret-scan.yml, the scan job's first and last steps). To
# start the record afresh (a tip marked read in error), run this workflow by hand with
# reset_record: that run checks every listed tip as on a first run and keeps a new record; if it
# fails before the scan writes one, it keeps an empty record (#703), so the old one is not used again.
# A re-run first looks for its own earlier attempt's record (#703). "Re-run failed jobs" (or a
# re-run of the scan job alone) leaves that record in the run, so the re-run goes on from it (seen
# live, #950), a reset run's re-run too (#703). "Re-run all jobs" deletes an earlier attempt's artifacts
# (#950), so that re-run warns and reads as a new run does: a reset run's from the empty record
# again (#791), any other from the newest earlier sweep's. So to go on from a sweep that stopped
# half-way (the scan's 20-minute limit, a failed lookup), use "Re-run failed jobs" or start a new
# run, not "Re-run all jobs". A "Re-run all jobs" that fails before the scan writes its record
# leaves its run with no record at all: safe, the next sweep only looks up those tips again.
# Sweeps of one ref run one at a time (the concurrency group below, #791): a sweep that starts while
# the reset run is running waits for it, then reads its record, so it cannot undo the reset. GitHub
# keeps one run waiting per group, and a newer run cancels the waiting one (never the running one),
# and the running run always ends, so no run waits for ever. A new sweep cancelled so loses only its
# own run: the newer run (same workflow, same ref) sweeps and alerts the same. A re-run cancelled so
# is not the same: the whole run then shows as cancelled, and the record its earlier attempt kept is
# no longer read (the reader takes only success or failure), so after a reset run the next sweep may
# read the record from before the reset. Never re-run a finished reset run; start a new reset run by
# hand with reset_record. A reset run cancelled so (or by hand) shows as cancelled and is not read:
# start the reset again as a new run by hand with reset_record, not a re-run (a re-run stays the
# older run, and the next sweep reads the newer one's record, from before the reset).
# Contract: fork-contracts.test.py (secret-scan).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      reset_record:
        description: Read no earlier record of deleted tips; check every listed tip as on a first run
        type: boolean
        default: false

permissions:
  contents: read

# One sweep of a ref at a time, never cancelled by a newer one (see the top): each reads the record
# of the one before it on that branch. Not in fork-secret-scan.yml: a push's scan must not wait.
concurrency:
  group: fork-secret-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Secret sweep
    uses: ./.github/workflows/fork-secret-scan.yml
    with:
      reset_record: ${{ inputs.reset_record == true }}

  alert:
    name: Sweep alert
    needs: sweep
    # A schedule event's payload may have no repository; a schedule runs on the default branch.
    if: ${{ always() && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Two sweeps at once (a schedule and a dispatch) would both find no open issue and open two.
    concurrency:
      group: fork-secret-sweep-alert
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /.github/scripts/fork-gh-guard.sh
            /.github/scripts/fork-run-alert.sh
          sparse-checkout-cone-mode: false

      - name: Open, update or close the sweep issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.sweep.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          bash .github/scripts/fork-run-alert.sh --title "Secret sweep failed" --result "$RESULT"
          --message "The daily secret sweep failed: a possible secret in a ref of this repository, or the scan could not finish (see the run). Rotate any real secret, then allow its exact, now dead, value in .gitleaks.toml."
