# GitHub secret scanning: paths it leaves out of its alerts.
#
# .gitleaks.toml is gitleaks' default config copied unchanged. Its rules carry gitleaks' own
# allowlists of well-known example keys (for example the Google API key samples), and GitHub's
# scanner reports each of them as a leaked key. They are not real keys.
#
# This does not open a gap: the fork's own Secret scan (.github/scripts/fork-secret-scan.sh, the
# required check) still scans this file in every change, and a change to it is its own reviewed
# pull request.
paths-ignore:
  - ".gitleaks.toml"
